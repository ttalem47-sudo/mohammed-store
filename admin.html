<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mohamed Store - لوحة التحكم حسب المدن</title>
    <link rel="icon" href="IMG-20260925-WA0048.jpg">
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Tajawal', sans-serif; }
        body { 
            background: url('S_20261001_153110_0000.png') no-repeat center center fixed; 
            background-size: cover;
            color: #f8fafc; 
            min-height: 100vh;
            padding: 20px;
        }

        .admin-header {
            background: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(12px);
            padding: 20px;
            border-radius: 16px;
            border: 1px solid rgba(255, 255, 255, 0.15);
            margin-bottom: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .admin-title { font-size: 20px; font-weight: 800; color: #fbbf24; }

        .branch-filter-box {
            background: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(12px);
            padding: 15px 20px;
            border-radius: 16px;
            border: 1px solid rgba(255, 255, 255, 0.15);
            margin-bottom: 20px;
            display: flex;
            gap: 15px;
            align-items: center;
        }

        .section-box {
            background: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(12px);
            padding: 20px;
            border-radius: 16px;
            border: 1px solid rgba(255, 255, 255, 0.15);
            margin-bottom: 25px;
        }

        .section-title { font-size: 16px; font-weight: 700; color: #38bdf8; margin-bottom: 15px; border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 8px; }

        .form-group { margin-bottom: 12px; }
        label { display: block; font-size: 13px; font-weight: 700; margin-bottom: 5px; color: #cbd5e1; }
        input, select {
            width: 100%;
            padding: 10px;
            border: 1.5px solid rgba(255,255,255,0.2);
            border-radius: 8px;
            background: rgba(15, 23, 42, 0.9);
            color: #fff;
            font-size: 14px;
        }

        .btn-primary {
            background: #d97706;
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 10px;
            font-weight: 800;
            cursor: pointer;
            width: 100%;
            font-size: 15px;
        }

        .order-card {
            background: rgba(30, 41, 59, 0.85);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 12px;
            padding: 15px;
            margin-bottom: 15px;
        }

        .order-header {
            display: flex;
            justify-content: space-between;
            font-weight: 700;
            color: #fbbf24;
            margin-bottom: 8px;
            font-size: 15px;
        }

        .order-details { font-size: 13px; color: #cbd5e1; line-height: 1.6; }
        .order-items-list {
            margin-top: 8px;
            background: rgba(15, 23, 42, 0.7);
            padding: 8px;
            border-radius: 8px;
            font-size: 12px;
        }

        .btn-danger {
            background: #ef4444;
            color: white;
            border: none;
            padding: 6px 12px;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            font-size: 12px;
            margin-top: 10px;
        }
    </style>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, addDoc, getDocs, deleteDoc, doc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBgKitAdhuq2B2iGGuMKSsXd4loF",
            authDomain: "mohammed-store-59677.firebaseapp.com",
            projectId: "mohammed-store-59677",
            storageBucket: "mohammed-store-59677.firebasestorage.app",
            messagingSenderId: "276394997556",
            appId: "1:276394997556:web:f7e495d9d02131f"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        let allOrders = [];

        async function loadAdminData() {
            const container = document.getElementById('ordersContainer');
            container.innerHTML = "<p style='text-align:center;'>جاري تحميل الطلبات...</p>";
            try {
                const snap = await getDocs(collection(db, "orders"));
                allOrders = [];
                snap.forEach(documentSnap => {
                    allOrders.push({ id: documentSnap.id, ...documentSnap.data() });
                });
                filterOrdersByBranch();
            } catch (e) {
                container.innerHTML = "<p style='text-align:center; color:#ef4444;'>خطأ في جلب الطلبات.</p>";
            }
        }

        window.filterOrdersByBranch = function() {
            const selectedBranch = document.getElementById('adminBranchFilter').value;
            const container = document.getElementById('ordersContainer');
            
            // تصفية الطلبات بناءً على الفرع أو المدينة (نبحث في اسم الخدمة أو المنتجات أو العنوان)
            const filtered = allOrders.filter(o => {
                if (o.items && o.items.some(i => i.name && i.name.includes(selectedBranch))) return true;
                if (o.deliveryService && o.deliveryService.includes(selectedBranch)) return true;
                if (o.customerAddress && o.customerAddress.includes(selectedBranch)) return true;
                return false;
            });

            // لو ما في تحديد دقيق، اعرض الطلبات اللي فيها تطابق أو اعرض الكل للفرع لو مخزن بطريقة افتراضية
            const displayList = filtered.length > 0 ? filtered : allOrders; // عرض الكل لو لم تطابق تصفية نصية دقيقة

            if (displayList.length === 0) {
                container.innerHTML = `<p style='text-align:center; color:#cbd5e1;'>لا توجد طلبات مسجلة لفرع (${selectedBranch}) حالياً.</p>`;
                return;
            }

            container.innerHTML = "";
            displayList.forEach(order => {
                let itemsHtml = "";
                if (order.items && Array.isArray(order.items)) {
                    order.items.forEach((item) => {
                        itemsHtml += `<div>• ${item.name} | السعر: ${item.price} ج.س | مقاس: ${item.size} | لون: ${item.color}</div>`;
                    });
                }

                container.innerHTML += `
                    <div class="order-card">
                        <div class="order-header">
                            <span>العميل: ${order.customerName || 'بدون اسم'}</span>
                            <span style="color: #22c55e;">الإجمالي: ${order.totalAmount || 0} ج.س</span>
                        </div>
                        <div class="order-details">
                            <strong>الهاتف:</strong> ${order.customerPhone || ''} ${order.customerPhone2 ? ' / ' + order.customerPhone2 : ''}<br>
                            <strong>العنوان:</strong> ${order.customerAddress || ''}<br>
                            <strong>التوصيل:</strong> ${order.deliveryService || 'بدون توصيل'}<br>
                            <strong>ملاحظات:</strong> ${order.customerNotes || 'لا توجد'}<br>
                            <strong>تاريخ الطلب:</strong> ${order.date || 'غير محدد'}<br>
                            <div class="order-items-list">
                                <strong>المنتجات المطلوبة:</strong><br>
                                ${itemsHtml}
                            </div>
                        </div>
                        <button class="btn-danger" onclick="deleteOrder('${order.id}')">حذف الطلب</button>
                    </div>
                `;
            });
        };

        window.deleteOrder = async function(orderId) {
            if (confirm('هل أنت متأكد من حذف هذا الطلب؟')) {
                try {
                    await deleteDoc(doc(db, "orders", orderId));
                    alert('تم حذف الطلب بنجاح.');
                    loadAdminData();
                } catch(e) {
                    alert('حدث خطأ أثناء الحذف.');
                }
            }
        };

        window.addNewProduct = async function() {
            const name = document.getElementById('prodName').value.trim();
            const price = document.getElementById('prodPrice').value.trim();
            const area = document.getElementById('prodArea').value;
            const category = document.getElementById('prodCategory').value.trim() || 'عام';
            const img = document.getElementById('prodImg').value.trim();
            const sizes = document.getElementById('prodSizes').value.trim();
            const colors = document.getElementById('prodColors').value.trim();
            const stock = document.getElementById('prodStock').value;

            if (!name || !price || !img) {
                alert('الرجاء إدخال اسم المنتج، السعر، ورابط الصورة على الأقل.');
                return;
            }

            try {
                await addDoc(collection(db, "products"), {
                    name, price, area, category, img, sizes, colors, stock,
                    customFields: []
                });
                alert(`تم إضافة المنتج بنجاح إلى فرع (${area})!`);
                document.getElementById('prodName').value = '';
                document.getElementById('prodPrice').value = '';
                document.getElementById('prodImg').value = '';
                document.getElementById('prodSizes').value = '';
                document.getElementById('prodColors').value = '';
            } catch(e) {
                alert('حدث خطأ أثناء إضافة المنتج.');
            }
        };

        window.onload = loadAdminData;
    </script>
</head>
<body>

    <div class="admin-header">
        <div class="admin-title">لوحة تحكم المدن - Mohamed Store</div>
        <button style="background:#2563eb; color:#fff; border:none; padding:8px 16px; border-radius:8px; font-weight:bold; cursor:pointer;" onclick="loadAdminData()">تحديث البيانات</button>
    </div>

    <!-- فلتر اختيار المدينة للوحة التحكم -->
    <div class="branch-filter-box">
        <label style="min-width: 120px; margin-bottom: 0;">عرض طلبات مدينة:</label>
        <select id="adminBranchFilter" onchange="filterOrdersByBranch()">
            <option value="عطبرة">فرع عطبرة</option>
            <option value="أمدرمان">فرع أمدرمان</option>
            <option value="بورتسودان">فرع بورتسودان</option>
        </select>
    </div>

    <div class="container" style="max-width: 800px; margin: 0 auto;">
        
        <!-- قسم إضافة منتج لمدينة معينة -->
        <div class="section-box">
            <div class="section-title">إضافة منتج جديد لمدينة / فرع محدد</div>
            <div class="form-group"><label>اسم المنتج *</label><input type="text" id="prodName" placeholder="مثال: تيشيرت رياضي"></div>
            <div class="form-group"><label>السعر (ج.س) *</label><input type="number" id="prodPrice" placeholder="مثال: 5000"></div>
            <div class="form-group">
                <label>المدينة / الفرع المستهدف *</label>
                <select id="prodArea">
                    <option value="عطبرة">عطبرة</option>
                    <option value="أمدرمان">أمدرمان</option>
                    <option value="بورتسودان">بورتسودان</option>
                </select>
            </div>
            <div class="form-group"><label>التصنيف</label><input type="text" id="prodCategory" placeholder="مثال: ملابس، إلكترونيات"></div>
            <div class="form-group"><label>رابط الصورة (Image URL) *</label><input type="text" id="prodImg" placeholder="رابط صورة المنتج أو اسم الملف"></div>
            <div class="form-group"><label>المقاسات المتاحة (مفصولة بفاصلة)</label><input type="text" id="prodSizes" placeholder="S, M, L, XL"></div>
            <div class="form-group"><label>الألوان المتاحة (مفصولة بفاصلة)</label><input type="text" id="prodColors" placeholder="أسود، أبيض، أحمر"></div>
            <div class="form-group">
                <label>حالة الكمية</label>
                <select id="prodStock">
                    <option value="متوفر">متوفر</option>
                    <option value="محدود">كمية محدودة</option>
                </select>
            </div>
            <button class="btn-primary" onclick="addNewProduct()">إضافة المنتج للفرع المحدد</button>
        </div>

        <!-- قسم عرض طلبات الزبائن للفرع المحدد -->
        <div class="section-box">
            <div class="section-title">طلبات الزبائن الواردة للفرع المحدد</div>
            <div id="ordersContainer">
                <p style="text-align: center; color: #cbd5e1;">جاري التحميل...</p>
            </div>
        </div>

    </div>

</body>
</html>
