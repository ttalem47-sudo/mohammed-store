<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mohamed Store - لوحة التحكم المركزية</title>
    <link rel="icon" href="IMG-20260925-WA0048.jpg">
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Tajawal', sans-serif; }
        body { 
            background: url('S_20261001_153110_0000.png') no-repeat center center fixed; 
            background-size: cover;
            color: #f8fafc; 
            min-height: 100vh;
            padding: 20px;
            position: relative;
        }
        body::before {
            content: '';
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(15, 23, 42, 0.75);
            backdrop-filter: blur(8px);
            z-index: -1;
        }

        .container { max-width: 900px; margin: 0 auto; }

        .header-box {
            background: rgba(15, 23, 42, 0.85); backdrop-filter: blur(12px);
            padding: 20px; border-radius: 16px; border: 1px solid rgba(255, 255, 255, 0.15);
            margin-bottom: 25px; text-align: center;
        }

        .title { font-size: 22px; font-weight: 800; color: #fbbf24; margin-bottom: 5px; }
        .subtitle { font-size: 14px; color: #cbd5e1; }

        #citySelectorView { display: flex; flex-direction: column; gap: 15px; max-width: 450px; margin: 50px auto; }

        .city-btn {
            background: rgba(30, 41, 59, 0.9); color: #f8fafc; border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 18px; border-radius: 14px; font-size: 18px; font-weight: 800; cursor: pointer;
            text-align: center; transition: all 0.3s; box-shadow: 0 4px 15px rgba(0,0,0,0.4);
        }
        .city-btn:hover { background: #d97706; border-color: #d97706; transform: translateY(-2px); }

        #cityAdminView { display: none; }

        .nav-tabs { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 20px; }

        .tab-btn {
            background: rgba(30, 41, 59, 0.85); color: #cbd5e1; border: 1px solid rgba(255, 255, 255, 0.15);
            padding: 12px; border-radius: 12px; font-weight: 700; font-size: 14px; cursor: pointer;
            text-align: center; transition: all 0.2s;
        }
        .tab-btn.active, .tab-btn:hover { background: #2563eb; color: #fff; border-color: #2563eb; }

        /* أزرار الأقسام داخل لوحة تحكم الفرع */
        .category-admin-tabs { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 15px; }
        .cat-admin-btn {
            background: rgba(30, 41, 59, 0.6); color: #cbd5e1; border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 8px; border-radius: 8px; font-weight: 700; font-size: 13px; cursor: pointer; text-align: center;
        }
        .cat-admin-btn.active { background: #d97706; color: #fff; border-color: #d97706; }

        .admin-section {
            display: none; background: rgba(15, 23, 42, 0.85); backdrop-filter: blur(12px);
            padding: 20px; border-radius: 16px; border: 1px solid rgba(255, 255, 255, 0.15); margin-bottom: 25px;
        }
        .admin-section.active { display: block; }

        .section-title {
            font-size: 16px; font-weight: 700; color: #38bdf8; margin-bottom: 15px;
            border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 8px;
            display: flex; justify-content: space-between; align-items: center;
        }

        .form-group { margin-bottom: 15px; }
        label { display: block; font-size: 13px; font-weight: 700; margin-bottom: 5px; color: #cbd5e1; }
        input, select, textarea {
            width: 100%; padding: 10px; border: 1.5px solid rgba(255,255,255,0.2);
            border-radius: 8px; background: rgba(15, 23, 42, 0.9); color: #fff; font-size: 14px;
        }
        textarea { resize: vertical; min-height: 60px; }

        .btn-primary {
            background: #d97706; color: white; border: none; padding: 12px;
            border-radius: 10px; font-weight: 800; cursor: pointer; width: 100%; font-size: 15px;
            transition: background 0.2s;
        }
        .btn-primary:hover { background: #b45309; }

        .btn-danger {
            background: #ef4444; color: white; border: none; padding: 6px 12px;
            border-radius: 6px; font-weight: bold; cursor: pointer; font-size: 12px;
        }
        .btn-edit {
            background: #2563eb; color: white; border: none; padding: 6px 12px;
            border-radius: 6px; font-weight: bold; cursor: pointer; font-size: 12px;
        }

        .btn-secondary {
            background: #475569; color: white; border: none; padding: 6px 12px;
            border-radius: 6px; font-weight: bold; cursor: pointer; font-size: 12px;
        }

        .order-card {
            background: rgba(30, 41, 59, 0.85); border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 12px; padding: 15px; margin-bottom: 15px;
        }
        .order-header {
            display: flex; justify-content: space-between; font-weight: 700; color: #fbbf24;
            margin-bottom: 8px; font-size: 15px;
        }
        .order-details { font-size: 13px; color: #cbd5e1; line-height: 1.6; }
        
        .unit-detail-box {
            display: flex; gap: 12px; align-items: center; background: rgba(15, 23, 42, 0.8);
            padding: 10px; border-radius: 8px; margin-top: 8px; border-right: 3px solid #38bdf8; font-size: 12px;
        }
        .order-product-thumb { width: 55px; height: 55px; object-fit: cover; border-radius: 6px; border: 1px solid #fbbf24; }

        .delivery-item-row {
            display: flex; justify-content: space-between; align-items: center; background: rgba(30, 41, 59, 0.8);
            padding: 10px; border-radius: 8px; margin-bottom: 8px; border: 1px solid rgba(255,255,255,0.1);
        }

        .preview-images-container { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 8px; }
        .preview-thumb { width: 60px; height: 60px; border-radius: 6px; object-fit: cover; border: 1px solid #fbbf24; cursor: pointer; }
    </style>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, addDoc, getDocs, deleteDoc, updateDoc, doc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBgKitAdhuq2B2iGGuMKSsXd4loF",
            authDomain: "mohammed-store-59677.firebaseapp.com",
            projectId: "mohammed-store-59677",
            storageBucket: "mohammed-store-59677.firebasestorage.app",
            messagingSenderId: "276394997556",
            appId: "1:276394997556:web:f7e495d9d02131f"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        let currentActiveCity = '';
        let currentActiveCategory = 'الشبابي';
        let uploadedImagesBase64 = [];
        let editingProductId = null;

        window.selectCityAdmin = function(cityName) {
            currentActiveCity = cityName;
            document.getElementById('citySelectorView').style.display = 'none';
            document.getElementById('cityAdminView').style.display = 'block';
            document.getElementById('currentCityTitle').innerText = `لوحة تحكم فرع: ${cityName}`;
            loadCityData();
        };

        window.backToCitySelector = function() {
            currentActiveCity = '';
            document.getElementById('cityAdminView').style.display = 'none';
            document.getElementById('citySelectorView').style.display = 'block';
            cancelEditProduct();
        };

        window.switchTab = function(tabId) {
            document.querySelectorAll('.admin-section').forEach(sec => sec.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            document.getElementById(tabId).classList.add('active');
            event.currentTarget.classList.add('active');
        };

        window.switchCategoryAdminTab = function(catName) {
            currentActiveCategory = catName;
            document.querySelectorAll('.cat-admin-btn').forEach(btn => btn.classList.remove('active'));
            event.currentTarget.classList.add('active');
            loadCityProducts();
        };

        async function loadCityData() {
            await loadCityProducts();
            await loadCityOrders();
            await loadCityDelivery();
        }

        function compressImage(file, maxWidth = 800, maxHeight = 800, quality = 0.7) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.onload = function(event) {
                    const img = new Image();
                    img.onload = function() {
                        let width = img.width;
                        let height = img.height;

                        if (width > height) {
                            if (width > maxWidth) { height *= maxWidth / width; width = maxWidth; }
                        } else {
                            if (height > maxHeight) { width *= maxHeight / height; height = maxHeight; }
                        }

                        const canvas = document.createElement('canvas');
                        canvas.width = width; canvas.height = height;
                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(img, 0, 0, width, height);

                        const compressedDataUrl = canvas.toDataURL('image/jpeg', quality);
                        resolve(compressedDataUrl);
                    };
                    img.onerror = reject;
                    img.src = event.target.result;
                };
                reader.onerror = reject;
                reader.readAsDataURL(file);
            });
        }

        window.handleImagesSelection = async function(event) {
            const files = event.target.files;
            uploadedImagesBase64 = [];
            const container = document.getElementById('imagePreviews');
            container.innerHTML = "جاري معالجة وضغط الصور...";

            if (files) {
                container.innerHTML = '';
                for (let file of files) {
                    try {
                        const compressedBase64 = await compressImage(file);
                        uploadedImagesBase64.push(compressedBase64);
                        container.innerHTML += `<img src="${compressedBase64}" class="preview-thumb" onclick="openFullPreview('${compressedBase64}')">`;
                    } catch (err) {
                        console.error("خطأ في معالجة الصورة:", err);
                    }
                }
            }
        };

        window.openFullPreview = function(imgSrc) {
            document.getElementById('modalPreviewImg').src = imgSrc;
            document.getElementById('fullImgModal').style.display = 'flex';
        };

        window.closeFullPreview = function() {
            document.getElementById('fullImgModal').style.display = 'none';
        };

        window.saveProduct = async function() {
            const name = document.getElementById('prodName').value.trim();
            const price = document.getElementById('prodPrice').value.trim();
            const category = document.getElementById('prodCategory').value;
            const sizes = document.getElementById('prodSizes').value.trim();
            const colors = document.getElementById('prodColors').value.trim();
            const stock = document.getElementById('prodStock').value;
            const adminNote = document.getElementById('prodAdminNote').value.trim();

            if (!name || !price) {
                alert('الرجاء إدخال اسم المنتج والسعر.');
                return;
            }

            if (!editingProductId && uploadedImagesBase64.length === 0) {
                alert('الرجاء اختيار صورة واحدة على الأقل للعرض.');
                return;
            }

            const btn = event.target;
            btn.disabled = true;
            btn.innerText = "جاري الحفظ...";

            try {
                if (editingProductId) {
                    const updateData = {
                        name, price, category, sizes, colors, stock, adminNote
                    };
                    if (uploadedImagesBase64.length > 0) {
                        updateData.img = uploadedImagesBase64[0];
                        updateData.images = uploadedImagesBase64;
                    }

                    await updateDoc(doc(db, "products", editingProductId), updateData);
                    alert('تم تعديل العرض بنجاح!');
                    cancelEditProduct();
                } else {
                    await addDoc(collection(db, "products"), {
                        name, price, 
                        area: currentActiveCity, 
                        category, 
                        img: uploadedImagesBase64[0], 
                        images: uploadedImagesBase64, 
                        sizes, colors, stock, adminNote,
                        customFields: []
                    });
                    alert('تم رفع المنتج بنجاح في القسم المخصص!');
                    document.getElementById('productForm').reset();
                    document.getElementById('imagePreviews').innerHTML = '';
                    uploadedImagesBase64 = [];
                }
                loadCityProducts();
            } catch(e) {
                console.error("خطأ في حفظ العرض:", e);
                alert('حدث خطأ أثناء حفظ العرض.');
            } finally {
                btn.disabled = false;
                btn.innerText = editingProductId ? "حفظ التعديلات" : "إتمام رفع العرض للمتجر";
            }
        };

        window.editProduct = async function(id, name, price, category, sizes, colors, stock, adminNote, img) {
            editingProductId = id;
            document.getElementById('prodName').value = name;
            document.getElementById('prodPrice').value = price;
            document.getElementById('prodCategory').value = category || 'الشبابي';
            document.getElementById('prodSizes').value = sizes || '';
            document.getElementById('prodColors').value = colors || '';
            document.getElementById('prodStock').value = stock || 'متوفر';
            document.getElementById('prodAdminNote').value = adminNote || '';
            
            document.getElementById('submitProductBtn').innerText = "حفظ التعديلات";
            document.getElementById('cancelEditBtn').style.display = "inline-block";
            
            document.getElementById('imagePreviews').innerHTML = `<img src="${img}" class="preview-thumb">`;
            window.scrollTo({ top: 0, behavior: 'smooth' });
        };

        window.cancelEditProduct = function() {
            editingProductId = null;
            document.getElementById('productForm').reset();
            document.getElementById('imagePreviews').innerHTML = '';
            uploadedImagesBase64 = [];
            document.getElementById('submitProductBtn').innerText = "إتمام رفع العرض للمتجر";
            document.getElementById('cancelEditBtn').style.display = "none";
        };

        async function loadCityProducts() {
            const container = document.getElementById('cityProductsList');
            container.innerHTML = "<p style='text-align:center;'>جاري تحميل العروض...</p>";
            try {
                const snap = await getDocs(collection(db, "products"));
                container.innerHTML = "";
                let count = 0;
                snap.forEach(documentSnap => {
                    const p = documentSnap.data();
                    if (p.area === currentActiveCity && (p.category || 'الشبابي') === currentActiveCategory) {
                        count++;
                        container.innerHTML += `
                            <div class="order-card" style="display:flex; justify-content:space-between; align-items:center;">
                                <div style="display:flex; gap:10px; align-items:center;">
                                    <img src="${p.img}" style="width:50px; height:50px; object-fit:cover; border-radius:6px; cursor:pointer;" onclick="openFullPreview('${p.img}')">
                                    <div>
                                        <strong>${p.name}</strong> - ${p.price} ج.س (${p.stock})<br>
                                        <span style="font-size:12px; color:#38bdf8;">القسم: ${p.category || 'الشبابي'}</span> | <span style="font-size:12px; color:#cbd5e1;">ملاحظة: ${p.adminNote || 'لا توجد'}</span>
                                    </div>
                                </div>
                                <div style="display:flex; gap:6px;">
                                    <button class="btn-edit" onclick="editProduct('${documentSnap.id}', '${p.name}', '${p.price}', '${p.category}', '${p.sizes}', '${p.colors}', '${p.stock}', '${p.adminNote}', '${p.img}')">تعديل</button>
                                    <button class="btn-danger" onclick="deleteProduct('${documentSnap.id}')">حذف</button>
                                </div>
                            </div>
                        `;
                    }
                });
                if (count === 0) container.innerHTML = `<p style='text-align:center; color:#cbd5e1;'>لا توجد عروض مرفوعة في قسم (${currentActiveCategory}) لهذا الفرع.</p>`;
            } catch(e) {
                console.error(e);
                container.innerHTML = "<p style='text-align:center; color:#ef4444;'>خطأ في التحميل.</p>";
            }
        }

        window.deleteProduct = async function(id) {
            if (confirm('هل أنت متأكد من حذف هذا العرض؟')) {
                await deleteDoc(doc(db, "products", id));
                loadCityProducts();
            }
        };

        window.clearMemoryCache = function() {
            if (confirm('هل تريد تصفية الذاكرة المؤقتة وتحديث الصفحة؟')) {
                location.reload();
            }
        };

        async function loadCityOrders() {
            const container = document.getElementById('cityOrdersContainer');
            container.innerHTML = "<p style='text-align:center;'>جاري تحميل الطلبات...</p>";
            try {
                const snap = await getDocs(collection(db, "orders"));
                container.innerHTML = "";
                let count = 0;
                snap.forEach(documentSnap => {
                    const order = documentSnap.data();
                    const orderId = documentSnap.id;
                    
                    if (order.branch === currentActiveCity) {
                        count++;
                        let itemsHtml = "";
                        if (order.items && Array.isArray(order.items)) {
                            order.items.forEach((item, idx) => {
                                itemsHtml += `
                                    <div class="unit-detail-box">
                                        <img src="${item.img || 'https://via.placeholder.com/55'}" class="order-product-thumb" onclick="openFullPreview('${item.img || ''}')">
                                        <div>
                                            <strong>قطعة (${idx + 1}):</strong> ${item.name}<br>
                                            <span style="color:#fbbf24;">مقاس: [${item.size || 'غير محدد'}] | لون: [${item.color || 'غير محدد'}]</span><br>
                                            <span style="color:#22c55e;">السعر: ${item.price} ج.س</span>
                                        </div>
                                    </div>
                                `;
                            });
                        }

                        container.innerHTML += `
                            <div class="order-card">
                                <div class="order-header">
                                    <span>العميل: ${order.customerName || 'بدون اسم'}</span>
                                    <span style="color: #22c55e;">الإجمالي: ${order.totalAmount || 0} ج.س</span>
                                </div>
                                <div class="order-details">
                                    <strong>الهاتف الأساسي:</strong> ${order.customerPhone || ''}<br>
                                    <strong>رقم احتياطي:</strong> ${order.customerPhone2 || 'لا يوجد'}<br>
                                    <strong>الموقع بالتحديد:</strong> ${order.customerAddress || ''}<br>
                                    <strong>خدمة التوصيل:</strong> ${order.deliveryService || 'بدون توصيل'}<br>
                                    <strong>ملاحظات العميل:</strong> ${order.customerNotes || 'لا توجد'}<br>
                                    <strong>تاريخ الطلب:</strong> ${order.date || 'غير محدد'}<br>
                                    <div style="margin-top: 10px;">
                                        <strong>تفاصيل القطع المطلوبة (مع صور العروض):</strong>
                                        ${itemsHtml}
                                    </div>
                                </div>
                                <div style="margin-top: 12px; display:flex; gap:10px;">
                                    <button class="btn-primary" style="padding:8px; font-size:13px;" onclick="confirmOrderDone('${orderId}')">تأكيد إتمام الطلبية</button>
                                    <button class="btn-danger" onclick="deleteOrder('${orderId}')">حذف</button>
                                </div>
                            </div>
                        `;
                    }
                });
                if (count === 0) container.innerHTML = "<p style='text-align:center; color:#cbd5e1;'>لا توجد طلبات معلقة لهذا الفرع.</p>";
            } catch(e) {
                console.error(e);
                container.innerHTML = "<p style='text-align:center; color:#ef4444;'>خطأ في جلب الطلبات.</p>";
            }
        }

        window.confirmOrderDone = async function(orderId) {
            alert('تم تأكيد إتمام الطلبية بنجاح!');
            await deleteDoc(doc(db, "orders", orderId));
            loadCityOrders();
        };

        window.deleteOrder = async function(orderId) {
            if (confirm('هل أنت متأكد من حذف هذا الطلب؟')) {
                await deleteDoc(doc(db, "orders", orderId));
                loadCityOrders();
            }
        };

        window.clearAllOrders = async function() {
            if (confirm('هل أنت متأكد من حذف وتصفية جميع الطلبات المعلقة؟')) {
                const snap = await getDocs(collection(db, "orders"));
                for (let d of snap.docs) {
                    if (d.data().branch === currentActiveCity) {
                        await deleteDoc(doc(db, "orders", d.id));
                    }
                }
                alert('تمت تصفية وحذف جميع الطلبات بنجاح.');
                loadCityOrders();
            }
        };

        window.addDeliveryArea = async function() {
            const name = document.getElementById('delAreaName').value.trim();
            const price = document.getElementById('delAreaPrice').value.trim();

            if (!name || !price) {
                alert('الرجاء إدخال اسم المنطقة وسعر التوصيل.');
                return;
            }

            try {
                await addDoc(collection(db, "delivery_options"), {
                    name, price: Number(price), area: currentActiveCity
                });
                alert('تمت إضافة منطقة التوصيل بنجاح!');
                document.getElementById('delAreaName').value = '';
                document.getElementById('delAreaPrice').value = '';
                loadCityDelivery();
            } catch(e) {
                console.error(e);
                alert('حدث خطأ أثناء إضافة منطقة التوصيل.');
            }
        };

        async function loadCityDelivery() {
            const container = document.getElementById('cityDeliveryList');
            container.innerHTML = "<p style='text-align:center;'>جاري التحميل...</p>";
            try {
                const snap = await getDocs(collection(db, "delivery_options"));
                container.innerHTML = "";
                let count = 0;
                snap.forEach(documentSnap => {
                    const opt = documentSnap.data();
                    if (opt.area === currentActiveCity) {
                        count++;
                        container.innerHTML += `
                            <div class="delivery-item-row">
                                <div><strong>${opt.name}</strong> - <span style="color:#22c55e;">${opt.price} ج.س</span></div>
                                <button class="btn-danger" onclick="deleteDelivery('${documentSnap.id}')">حذف</button>
                            </div>
                        `;
                    }
                });
                if (count === 0) container.innerHTML = "<p style='text-align:center; color:#cbd5e1;'>لا توجد مناطق توصيل مضافة لهذا الفرع.</p>";
            } catch(e) {
                console.error(e);
                container.innerHTML = "<p style='text-align:center; color:#ef4444;'>خطأ في التحميل.</p>";
            }
        }

        window.deleteDelivery = async function(id) {
            if (confirm('هل تريد حذف منطقة التوصيل هذه؟')) {
                await deleteDoc(doc(db, "delivery_options", id));
                loadCityDelivery();
            }
        };
    </script>
</head>
<body>

    <div class="container">
        
        <div class="header-box">
            <div class="title">Mohamed Store</div>
            <div class="subtitle">لوحة التحكم المركزية للإدارة حسب المدن والأقسام</div>
        </div>

        <div id="citySelectorView">
            <div style="text-align: center; font-weight: 700; color: #fbbf24; margin-bottom: 10px; font-size: 16px;">اختر الفرع أو المدينة للإدارة:</div>
            <button class="city-btn" onclick="selectCityAdmin('عطبرة')">فرع عطبرة</button>
            <button class="city-btn" onclick="selectCityAdmin('أمدرمان')">فرع أمدرمان</button>
            <button class="city-btn" onclick="selectCityAdmin('بورتسودان')">فرع بورتسودان</button>
        </div>

        <div id="cityAdminView">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px;">
                <span id="currentCityTitle" style="font-weight: 800; color: #fbbf24; font-size: 18px;"></span>
                <button class="btn-secondary" onclick="backToCitySelector()">رجوع لاختيار المدن</button>
            </div>

            <div class="nav-tabs">
                <button class="tab-btn active" onclick="switchTab('sectionUpload')">رفع وتعديل العروض</button>
                <button class="tab-btn" onclick="switchTab('sectionOrders')">الطلبات المعلقة</button>
                <button class="tab-btn" onclick="switchTab('sectionDelivery')">خدمات التوصيل</button>
            </div>

            <div id="sectionUpload" class="admin-section active">
                <div class="section-title">
                    <span>إدارة وعروض المنتجات</span>
                    <button class="btn-secondary" onclick="clearMemoryCache()">تصفية الذاكرة</button>
                </div>

                <form id="productForm" onsubmit="event.preventDefault(); saveProduct();">
                    <div class="form-group"><label>اسم المنتج *</label><input type="text" id="prodName" placeholder="مثال: تيشيرت رياضي"></div>
                    <div class="form-group"><label>السعر (ج.س) *</label><input type="number" id="prodPrice" placeholder="مثال: 5000"></div>
                    
                    <div class="form-group">
                        <label>القسم المستهدف *</label>
                        <select id="prodCategory">
                            <option value="الشبابي">الشبابي</option>
                            <option value="القمصان والبناطلين">القمصان والبناطلين</option>
                            <option value="اسبورتات">اسبورتات</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label>اختر الصور من المعرض (يمكن اختيار عدة صور)</label>
                        <input type="file" id="prodImagesInput" accept="image/*" multiple onchange="handleImagesSelection(event)" style="padding: 7px;">
                        <div id="imagePreviews" class="preview-images-container"></div>
                    </div>

                    <div class="form-group"><label>المقاسات المتاحة (مفصولة بفاصلة)</label><input type="text" id="prodSizes" placeholder="S, M, L, XL"></div>
                    <div class="form-group"><label>الألوان المتاحة (مفصولة بفاصلة)</label><input type="text" id="prodColors" placeholder="أسود، أبيض، أحمر"></div>
                    <div class="form-group">
                        <label>حالة الكمية</label>
                        <select id="prodStock">
                            <option value="متوفر">متوفر بكثرة</option>
                            <option value="محدود">كمية محدودة</option>
                        </select>
                    </div>
                    <div class="form-group"><label>ملاحظة الأدمن الخاصة بالعرض</label><textarea id="prodAdminNote" placeholder="أي ملاحظة تظهر مع المنتج"></textarea></div>
                    
                    <div style="display: flex; gap: 10px;">
                        <button type="submit" id="submitProductBtn" class="btn-primary">إتمام رفع العرض للمتجر</button>
                        <button type="button" id="cancelEditBtn" class="btn-danger" style="display:none; width:auto;" onclick="cancelEditProduct()">إلغاء التعديل</button>
                    </div>
                </form>

                <div style="margin-top: 25px;">
                    <div style="font-weight: 700; color: #fbbf24; margin-bottom: 10px;">العروض الحالية في الفرع (حسب القسم):</div>
                    
                    <div class="category-admin-tabs">
                        <button class="cat-admin-btn active" onclick="switchCategoryAdminTab('الشبابي')">الشبابي</button>
                        <button class="cat-admin-btn" onclick="switchCategoryAdminTab('القمصان والبناطلين')">القمصان والبناطلين</button>
                        <button class="cat-admin-btn" onclick="switchCategoryAdminTab('اسبورتات')">اسبورتات</button>
                    </div>

                    <div id="cityProductsList"></div>
                </div>
            </div>

            <div id="sectionOrders" class="admin-section">
                <div class="section-title">
                    <span>طلبات الزبائن الواردة (مع صور العروض)</span>
                    <button class="btn-danger" onclick="clearAllOrders()">حذف وتصفية كافة الطلبات</button>
                </div>
                <div id="cityOrdersContainer">
                    <p style="text-align: center; color: #cbd5e1;">جاري تحميل الطلبات...</p>
                </div>
            </div>

            <div id="sectionDelivery" class="admin-section">
                <div class="section-title">إدارة مناطق وأسعار التوصيل داخل المدينـة</div>
                <div class="form-group"><label>اسم المنطقة / الحي *</label><input type="text" id="delAreaName" placeholder="مثال: حيشان، السوق العربي"></div>
                <div class="form-group"><label>سعر التوصيل (ج.س) *</label><input type="number" id="delAreaPrice" placeholder="مثال: 1500"></div>
                <button class="btn-primary" onclick="addDeliveryArea()">إضافة منطقة التوصيل</button>

                <div style="margin-top: 25px;">
                    <div style="font-weight: 700; color: #fbbf24; margin-bottom: 10px;">مناطق التوصيل المتاحة للفرع:</div>
                    <div id="cityDeliveryList"></div>
                </div>
            </div>

        </div>

    </div>

    <div id="fullImgModal" style="position:fixed; top:0; left:0; right:0; bottom:0; background:rgba(15,23,42,0.9); display:none; justify-content:center; align-items:center; z-index:3000; padding:20px;" onclick="closeFullPreview()">
        <img id="modalPreviewImg" src="" style="max-width:100%; max-height:85vh; border-radius:12px; border:2px solid #fbbf24;">
    </div>

</body>
</html>
