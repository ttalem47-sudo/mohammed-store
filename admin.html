<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة التحكم - Mohamed Store</title>
    <link rel="icon" href="IMG-20260925-WA0048.jpg">
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Tajawal', sans-serif; }
        
        body { 
            background: #0f172a; 
            color: #f8fafc; 
            min-height: 100vh;
            padding: 20px;
        }

        .container { max-width: 900px; margin: 0 auto; }

        .header {
            background: rgba(30, 41, 59, 0.8);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 20px;
            border-radius: 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.3);
        }

        .header h1 { font-size: 20px; color: #fbbf24; font-weight: 800; }
        
        .section-box {
            background: rgba(30, 41, 59, 0.7);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            padding: 20px;
            margin-bottom: 25px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.3);
        }

        .section-title {
            font-size: 18px;
            font-weight: 800;
            color: #38bdf8;
            margin-bottom: 15px;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            padding-bottom: 8px;
        }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-bottom: 15px;
        }

        .form-group { margin-bottom: 12px; }
        .form-group label { display: block; font-size: 13px; font-weight: 700; margin-bottom: 5px; color: #cbd5e1; }
        .form-group input, .form-group select, .form-group textarea {
            width: 100%;
            padding: 10px;
            border: 1.5px solid rgba(255,255,255,0.2);
            border-radius: 8px;
            background: rgba(15, 23, 42, 0.9);
            color: #fff;
            font-size: 14px;
        }

        .btn {
            background: #2563eb;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            font-weight: 700;
            cursor: pointer;
            transition: background 0.2s;
        }
        .btn:hover { background: #1d4ed8; }
        .btn-danger { background: #dc2626; }
        .btn-danger:hover { background: #b91c1c; }

        .items-list {
            margin-top: 15px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .item-row {
            background: rgba(15, 23, 42, 0.8);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 12px 15px;
            border-radius: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .item-info { font-size: 14px; font-weight: 700; color: #f8fafc; }
        .item-sub { font-size: 12px; color: #94a3b8; margin-top: 3px; }
    </style>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, addDoc, getDocs, deleteDoc, doc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBgKitAdhuq2B2iGGuMKSsXd4loF",
            authDomain: "mohammed-store-59677.firebaseapp.com",
            projectId: "mohammed-store-59677",
            storageBucket: "mohammed-store-59677.firebasestorage.app",
            messagingSenderId: "276394997556",
            appId: "1:276394997556:web:f7e495d9d02131f"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // --- إدارة خيارات التوصيل ---
        window.saveDeliveryOption = async function() {
            const name = document.getElementById('delName').value.trim();
            const price = document.getElementById('delPrice').value.trim();
            const city = document.getElementById('delCity').value.trim();

            if (!name || !price || !city) {
                alert('يرجى إدخال اسم وسيلة التوصيل، السعر، وتحديد المدينة التابعة لها.');
                return;
            }

            try {
                await addDoc(collection(db, "delivery_options"), {
                    name,
                    price: Number(price),
                    city
                });
                alert('تم إضافة خيار التوصيل بنجاح!');
                document.getElementById('delName').value = '';
                document.getElementById('delPrice').value = '';
                loadDeliveryOptions();
            } catch (e) {
                alert('حدث خطأ أثناء الحفظ.');
            }
        };

        async function loadDeliveryOptions() {
            const listContainer = document.getElementById('deliveryList');
            listContainer.innerHTML = 'جاري التحميل...';
            try {
                const querySnapshot = await getDocs(collection(db, "delivery_options"));
                listContainer.innerHTML = '';
                if(querySnapshot.empty) {
                    listContainer.innerHTML = '<div class="item-sub">لا توجد خيارات توصيل مسجلة حالياً.</div>';
                    return;
                }
                querySnapshot.forEach((documentSnap) => {
                    const data = documentSnap.data();
                    listContainer.innerHTML += `
                        <div class="item-row">
                            <div>
                                <div class="item-info">🚚 ${data.name} - السعر: ${data.price} ج.س</div>
                                <div class="item-sub">📍 المدينة/المنطقة: ${data.city}</div>
                            </div>
                            <button class="btn btn-danger" onclick="deleteDelivery('${documentSnap.id}')">حذف</button>
                        </div>
                    `;
                });
            } catch (e) {
                listContainer.innerHTML = 'خطأ في جلب خيارات التوصيل';
            }
        }

        window.deleteDelivery = async function(id) {
            if (confirm('هل أنت متأكد من حذف خيار التوصيل هذا؟')) {
                try {
                    await deleteDoc(doc(db, "delivery_options", id));
                    loadDeliveryOptions();
                } catch(e) {
                    alert('خطأ في الحذف');
                }
            }
        };


        // --- إدارة المنتجات والعروض ---
        let customFieldsList = [];

        window.addCustomFieldInput = function() {
            const name = document.getElementById('cfName').value.trim();
            const value = document.getElementById('cfValue').value.trim();
            if(!name || !value) {
                alert('أدخل اسم الحقل والقيمة');
                return;
            }
            customFieldsList.push({ name, value });
            renderCustomFieldsPreview();
            document.getElementById('cfName').value = '';
            document.getElementById('cfValue').value = '';
        };

        function renderCustomFieldsPreview() {
            const container = document.getElementById('customFieldsPreview');
            container.innerHTML = '';
            customFieldsList.forEach((cf, idx) => {
                container.innerHTML += `<span style="background:#334155; padding:4px 8px; border-radius:6px; font-size:12px; display:inline-block; margin:3px;">${cf.name}: ${cf.value} <button onclick="customFieldsList.splice(${idx},1); renderCustomFieldsPreview();" style="background:none; border:none; color:#f87171; cursor:pointer;">×</button></span>`;
            });
        }

        window.saveProduct = async function() {
            const name = document.getElementById('pName').value.trim();
            const price = document.getElementById('pPrice').value.trim();
            const img = document.getElementById('pImg').value.trim();
            const area = document.getElementById('pArea').value;
            const sizes = document.getElementById('pSizes').value.trim();
            const colors = document.getElementById('pColors').value.trim();

            if (!name || !price || !img) {
                alert('يرجى ملء الحقول الأساسية (الاسم، السعر، ورابط الصورة).');
                return;
            }

            try {
                await addDoc(collection(db, "products"), {
                    name,
                    price: Number(price),
                    img,
                    area,
                    sizes: sizes || 'حسب المتاح',
                    colors: colors || 'جميع الألوان متوفرة',
                    customFields: customFieldsList
                });
                alert('تم إضافة العرض بنجاح!');
                document.getElementById('pName').value = '';
                document.getElementById('pPrice').value = '';
                document.getElementById('pImg').value = '';
                document.getElementById('pSizes').value = '';
                document.getElementById('pColors').value = '';
                customFieldsList = [];
                renderCustomFieldsPreview();
                loadProducts();
            } catch(e) {
                alert('حدث خطأ أثناء حفظ المنتج');
            }
        };

        async function loadProducts() {
            const listContainer = document.getElementById('productsList');
            listContainer.innerHTML = 'جاري التحميل...';
            try {
                const querySnapshot = await getDocs(collection(db, "products"));
                listContainer.innerHTML = '';
                if(querySnapshot.empty) {
                    listContainer.innerHTML = '<div class="item-sub">لا توجد عروض مسجلة حالياً.</div>';
                    return;
                }
                querySnapshot.forEach((documentSnap) => {
                    const data = documentSnap.data();
                    listContainer.innerHTML += `
                        <div class="item-row">
                            <div>
                                <div class="item-info">🛍️ ${data.name} - السعر: ${data.price} ج.س</div>
                                <div class="item-sub">📍 المنطقة: ${data.area || 'عطبرة'} | المقاسات: ${data.sizes || 'حسب المتاح'}</div>
                            </div>
                            <button class="btn btn-danger" onclick="deleteProduct('${documentSnap.id}')">حذف</button>
                        </div>
                    `;
                });
            } catch(e) {
                listContainer.innerHTML = 'خطأ في جلب المنتجات';
            }
        }

        window.deleteProduct = async function(id) {
            if(confirm('هل أنت متأكد من حذف هذا العرض؟')) {
                try {
                    await deleteDoc(doc(db, "products", id));
                    loadProducts();
                } catch(e) {
                    alert('خطأ في الحذف');
                }
            }
        };

        window.onload = () => {
            loadDeliveryOptions();
            loadProducts();
        };
    </script>
</head>
<body>

    <div class="container">
        <div class="header">
            <h1>لوحة تحكم المتجر - Admin Panel</h1>
            <a href="index.html" class="btn" style="text-decoration:none; font-size:13px;" target="_blank">عرض المتجر 🌐</a>
        </div>

        <!-- قسم إدارة خيارات التوصيل (محدث ليرتبط بالمدينة) -->
        <div class="section-box">
            <div class="section-title">🚚 إدارة خيارات التوصيل حسب المدينة</div>
            <div class="form-grid">
                <div class="form-group">
                    <label>المدينة / المنطقة التابعة *</label>
                    <select id="delCity">
                        <option value="عطبرة">عطبرة</option>
                        <option value="أمدرمان">أمدرمان</option>
                        <option value="بورتسودان">بورتسودان</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>اسم وسيلة التوصيل *</label>
                    <input type="text" id="delName" placeholder="مثال: توصيل منزلي سريع / شحن محلي">
                </div>
                <div class="form-group">
                    <label>سعر التوصيل (بالجنيه) *</label>
                    <input type="number" id="delPrice" placeholder="مثال: 3000">
                </div>
            </div>
            <button class="btn" onclick="saveDeliveryOption()">حفظ وإضافة خيار التوصيل</button>
            
            <div class="items-list" id="deliveryList"></div>
        </div>

        <!-- قسم إضافة عرض/منتج جديد -->
        <div class="section-box">
            <div class="section-title">📦 إضافة عرض أو منتج جديد</div>
            <div class="form-grid">
                <div class="form-group">
                    <label>اسم العرض/المنتج *</label>
                    <input type="text" id="pName" placeholder="مثال: تيشيرت رياضي">
                </div>
                <div class="form-group">
                    <label>السعر (ج.س) *</label>
                    <input type="number" id="pPrice" placeholder="مثال: 15000">
                </div>
                <div class="form-group">
                    <label>رابط الصورة *</label>
                    <input type="text" id="pImg" placeholder="رابط مباشر للصورة">
                </div>
                <div class="form-group">
                    <label>المنطقة / المدينة *</label>
                    <select id="pArea">
                        <option value="عطبرة">عطبرة</option>
                        <option value="أمدرمان">أمدرمان</option>
                        بورتسودان<option value="بورتسودان">بورتسودان</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>المقاسات المتاحة</label>
                    <input type="text" id="pSizes" placeholder="مثال: S, M, L, XL أو مقاسات حذاء">
                </div>
                <div class="form-group">
                    <label>الألوان المتاحة</label>
                    <input type="text" id="pColors" placeholder="مثال: أسود، أبيض، أزرق">
                </div>
            </div>

            <div style="background: rgba(15,23,42,0.5); padding: 12px; border-radius: 8px; margin-bottom: 15px;">
                <label style="font-size: 13px; font-weight: bold; color: #cbd5e1; display: block; margin-bottom: 5px;">إضافة حقول مخصصة للعرض (اختياري)</label>
                <div style="display: flex; gap: 10px;">
                    <input type="text" id="cfName" placeholder="اسم الحقل (مثل: المادة المنفذة)" style="padding:6px; border-radius:6px; border:1px solid #475569; background:#0f172a; color:#fff; flex:1;">
                    <input type="text" id="cfValue" placeholder="القيمة (مثل: قطن خالص)" style="padding:6px; border-radius:6px; border:1px solid #475569; background:#0f172a; color:#fff; flex:1;">
                    <button class="btn" onclick="addCustomFieldInput()" style="padding: 6px 15px;">إضافة حقل</button>
                </div>
                <div id="customFieldsPreview" style="margin-top: 8px;"></div>
            </div>

            <button class="btn" onclick="saveProduct()">حفظ ونشر العرض</button>

            <div class="items-list" id="productsList" style="margin-top: 20px;"></div>
        </div>
    </div>

</body>
</html>
