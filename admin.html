<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة التحكم - Mohamed Store</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Tajawal', sans-serif; }
        body { background: #0f172a; color: #f8fafc; padding: 20px; }
        .container { max-width: 900px; margin: 0 auto; }
        h1 { text-align: center; color: #fbbf24; margin-bottom: 20px; font-weight: 800; }
        
        .card {
            background: #1e293b;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;
            border: 1px solid #334155;
        }
        .card-title { font-size: 18px; font-weight: 700; color: #38bdf8; margin-bottom: 15px; border-bottom: 1px solid #334155; padding-bottom: 8px; }
        
        .form-group { margin-bottom: 12px; }
        label { display: block; font-size: 13px; color: #cbd5e1; margin-bottom: 5px; }
        input, select, textarea {
            width: 100%;
            padding: 10px;
            border-radius: 8px;
            border: 1px solid #475569;
            background: #0f172a;
            color: #fff;
            font-size: 14px;
        }
        
        .btn {
            background: #2563eb;
            color: white;
            border: none;
            padding: 10px 18px;
            border-radius: 8px;
            font-weight: 700;
            cursor: pointer;
            transition: 0.2s;
        }
        .btn-success { background: #16a34a; }
        .btn-danger { background: #dc2626; padding: 5px 10px; font-size: 12px; }

        .item-list { margin-top: 15px; }
        .item-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #0f172a;
            padding: 10px 15px;
            border-radius: 8px;
            margin-bottom: 8px;
            border: 1px solid #334155;
        }

        .badge {
            background: #d97706;
            color: #fff;
            padding: 2px 8px;
            border-radius: 6px;
            font-size: 12px;
            margin-right: 5px;
        }
    </style>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, addDoc, getDocs, deleteDoc, doc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBgKitAdhuq2B2iGGuMKSsXd4loF",
            authDomain: "mohammed-store-59677.firebaseapp.com",
            projectId: "mohammed-store-59677",
            storageBucket: "mohammed-store-59677.firebasestorage.app",
            messagingSenderId: "276394997556",
            appId: "1:276394997556:web:f7e495d9d02131f"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // إضافة خيار توصيل جديد مخصص لمدينة
        window.addDeliveryOption = async function() {
            const area = document.getElementById('delArea').value.trim();
            const name = document.getElementById('delName').value.trim();
            const price = Number(document.getElementById('delPrice').value);

            if (!name || isNaN(price)) {
                alert('يرجى ملء اسم التوصيل والسعر بشكل صحيح.');
                return;
            }

            try {
                await addDoc(collection(db, "delivery_options"), { area, name, price });
                alert('تمت إضافة خيار التوصيل بنجاح');
                document.getElementById('delName').value = '';
                document.getElementById('delPrice').value = '';
                loadDeliveries();
            } catch (e) {
                alert('حدث خطأ أثناء الإضافة');
            }
        };

        // تحميل خيارات التوصيل
        async function loadDeliveries() {
            const list = document.getElementById('deliveryList');
            list.innerHTML = 'جاري التحميل...';
            try {
                const snap = await getDocs(collection(db, "delivery_options"));
                list.innerHTML = '';
                if (snap.empty) {
                    list.innerHTML = '<p style="color:#94a3b8;">لا توجد خيارات توصيل مضافة.</p>';
                    return;
                }
                snap.forEach(d => {
                    const data = d.data();
                    list.innerHTML += `
                        <div class="item-row">
                            <div>
                                <span class="badge">${data.area || 'عطبرة'}</span>
                                <strong>${data.name}</strong> - ${data.price} ج.س
                            </div>
                            <button class="btn btn-danger" onclick="deleteDelivery('${d.id}')">حذف</button>
                        </div>
                    `;
                });
            } catch (e) {
                list.innerHTML = 'خطأ في التحميل';
            }
        }

        window.deleteDelivery = async function(id) {
            if (confirm('هل أنت تأكد من حذف خيار التوصيل هذا؟')) {
                await deleteDoc(doc(db, "delivery_options", id));
                loadDeliveries();
            }
        };

        window.onload = () => {
            loadDeliveries();
        };
    </script>
</head>
<body>
    <div class="container">
        <h1>⚙️ إدارة خيارات التوصيل حسب المدينة</h1>

        <div class="card">
            <div class="card-title">إضافة خدمة توصيل جديدة</div>
            <div class="form-group">
                <label>تتبع لمنطقة / مدينة:</label>
                <select id="delArea">
                    <option value="عطبرة">عطبرة</option>
                    <option value="أمدرمان">أمدرمان</option>
                    <option value="بورتسودان">بورتسودان</option>
                </select>
            </div>
            <div class="form-group">
                <label>اسم خيار التوصيل (مثال: توصيل داخلي / استلام من المحل)</label>
                <input type="text" id="delName" placeholder="مثال: توصيل منزلي سريع">
            </div>
            <div class="form-group">
                <label>سعر التوصيل (ج.س)</label>
                <input type="number" id="delPrice" placeholder="مثال: 2000">
            </div>
            <button class="btn btn-success" onclick="addDeliveryOption()">حفظ خيار التوصيل</button>
        </div>

        <div class="card">
            <div class="card-title">قائمة خيارات التوصيل المضافة</div>
            <div class="item-list" id="deliveryList"></div>
        </div>
    </div>
</body>
</html>
