<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة التحكم - Mohammed Store</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Tajawal', sans-serif; }
        body { background: #0f172a; color: #f8fafc; padding: 20px; min-height: 100vh; }
        
        .container { max-width: 900px; margin: 0 auto; }
        
        h1 { color: #fbbf24; text-align: center; margin-bottom: 25px; font-weight: 800; font-size: 24px; }
        
        .card {
            background: rgba(30, 41, 59, 0.85);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 16px;
            padding: 20px;
            margin-bottom: 25px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.3);
        }
        
        .card-title { font-size: 18px; font-weight: 800; color: #38bdf8; margin-bottom: 15px; border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 8px; }
        
        .form-group { margin-bottom: 12px; }
        .form-group label { display: block; font-size: 13px; font-weight: 700; margin-bottom: 5px; color: #cbd5e1; }
        .form-group input, .form-group select, .form-group textarea {
            width: 100%; padding: 10px; border: 1px solid rgba(255,255,255,0.2);
            border-radius: 8px; background: #0f172a; color: #fff; font-size: 14px;
        }
        
        .btn {
            background: #d97706; color: white; border: none; padding: 12px 20px;
            border-radius: 8px; font-weight: 800; cursor: pointer; width: 100%; font-size: 15px;
            transition: background 0.2s;
        }
        .btn:hover { background: #b45309; }
        .btn-danger { background: #dc2626; }
        .btn-danger:hover { background: #b91c1c; }
        .btn-edit { background: #2563eb; }
        .btn-edit:hover { background: #1d4ed8; }

        /* أزرار الفروع والأقسام */
        .branch-tabs, .cat-tabs {
            display: flex; gap: 10px; margin-bottom: 15px; overflow-x: auto; padding-bottom: 5px;
        }
        .branch-tab, .cat-tab {
            background: #1e293b; color: #cbd5e1; border: 1px solid rgba(255,255,255,0.15);
            padding: 8px 16px; border-radius: 10px; font-weight: 700; cursor: pointer; white-space: nowrap; font-size: 13px;
        }
        .branch-tab.active, .cat-tab.active { background: #d97706; color: white; border-color: #d97706; }

        /* تنسيق الطلبات */
        .order-card {
            background: #1e293b; border: 1px solid rgba(255,255,255,0.1); border-radius: 12px; padding: 15px; margin-bottom: 15px;
        }
        .order-header {
            display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 8px; margin-bottom: 10px; font-size: 14px;
        }
        .order-details { font-size: 13px; color: #cbd5e1; line-height: 1.6; }
        
        /* عناصر المنتج داخل الطلب مع الصور */
        .order-item-row {
            display: flex; align-items: center; gap: 10px; background: #0f172a; padding: 8px; border-radius: 8px; margin-top: 6px; font-size: 12px;
        }
        .order-item-img { width: 50px; height: 50px; object-fit: cover; border-radius: 6px; background: #1e293b; }

        /* جدول إدارة المنتجات للتعديل */
        .manage-product-row {
            display: flex; justify-content: space-between; align-items: center; background: #1e293b; padding: 10px; border-radius: 8px; margin-bottom: 8px; font-size: 13px;
        }
    </style>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, addDoc, getDocs, deleteDoc, updateDoc, doc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBgKitAdhuq2B2iGGuMKSsXd4loF",
            authDomain: "mohammed-store-59677.firebaseapp.com",
            projectId: "mohammed-store-59677",
            storageBucket: "mohammed-store-59677.firebasestorage.app",
            messagingSenderId: "276394997556",
            appId: "1:276394997556:web:f7e495d9d02131f"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        let allOrders = [];
        let allProducts = [];
        let currentBranch = 'عطبرة';
        let editingProductId = null; // لتحديد ما إذا كنا نقوم بتعديل منتج حالي

        // حفظ أو تحديث منتج
        window.saveProduct = async function() {
            const name = document.getElementById('pName').value.trim();
            const price = document.getElementById('pPrice').value.trim();
            const area = document.getElementById('pArea').value;
            const category = document.getElementById('pCategory').value;
            const img = document.getElementById('pImg').value.trim();
            const sizes = document.getElementById('pSizes').value.trim();
            const colors = document.getElementById('pColors').value.trim();

            if (!name || !price || !img) {
                alert('يرجى ملء الحقول الأساسية (اسم المنتج، السعر، رابط الصورة)');
                return;
            }

            try {
                if (editingProductId) {
                    // تحديث منتج موجود
                    await updateDoc(doc(db, "products", editingProductId), {
                        name, price, area, category, img, sizes, colors
                    });
                    alert('تم تعديل العرض بنجاح!');
                    editingProductId = null;
                    document.getElementById('submitProductBtn').innerText = 'نشر العرض في المتجر';
                    document.getElementById('cancelEditBtn').style.display = 'none';
                } else {
                    // إضافة منتج جديد
                    await addDoc(collection(db, "products"), {
                        name, price, area, category, img, sizes, colors
                    });
                    alert('تمت إضافة العرض بنجاح!');
                }
                document.getElementById('productForm').reset();
                loadAdminData();
            } catch (e) {
                console.error(e);
                alert('حدث خطأ أثناء الحفظ');
            }
        };

        // تعبئة بيانات المنتج للتعديل
        window.editProduct = function(id) {
            const p = allProducts.find(item => item.id === id);
            if(!p) return;

            document.getElementById('pName').value = p.name;
            document.getElementById('pPrice').value = p.price;
            document.getElementById('pArea').value = p.area || 'عطبرة';
            document.getElementById('pCategory').value = p.category || 'الشبابي';
            document.getElementById('pImg').value = p.img;
            document.getElementById('pSizes').value = p.sizes || '';
            document.getElementById('pColors').value = p.colors || '';

            editingProductId = p.id;
            document.getElementById('submitProductBtn').innerText = 'حفظ التعديلات';
            document.getElementById('cancelEditBtn').style.display = 'block';
            window.scrollTo({ top: 0, behavior: 'smooth' });
        };

        window.cancelEdit = function() {
            editingProductId = null;
            document.getElementById('productForm').reset();
            document.getElementById('submitProductBtn').innerText = 'نشر العرض في المتجر';
            document.getElementById('cancelEditBtn').style.display = 'none';
        };

        // حذف منتج
        window.deleteProduct = async function(id) {
            if(confirm('هل أنت متأكد من حذف هذا العرض؟')) {
                await deleteDoc(doc(db, "products", id));
                loadAdminData();
            }
        };

        // إضافة وسيلة توصيل
        window.addNewDelivery = async function() {
            const name = document.getElementById('dName').value.trim();
            const price = document.getElementById('dPrice').value.trim();
            const area = document.getElementById('dArea').value;

            if (!name || !price) return alert('يرجى كتابة الاسم والسعر');

            try {
                await addDoc(collection(db, "delivery_options"), { name, price: Number(price), area });
                alert('تمت الإضافة بنجاح!');
                document.getElementById('deliveryForm').reset();
                loadAdminData();
            } catch (e) { console.error(e); }
        };

        window.deleteDelivery = async function(id) {
            if (confirm('حذف وسيلة التوصيل؟')) {
                await deleteDoc(doc(db, "delivery_options", id));
                loadAdminData();
            }
        };

        window.deleteOrder = async function(id) {
            if (confirm('هل تريد حذف هذا الطلب؟')) {
                await deleteDoc(doc(db, "orders", id));
                loadAdminData();
            }
        };

        // تحميل بيانات الإدارة
        async function loadAdminData() {
            try {
                // جلب الطلبات
                const ordersSnap = await getDocs(collection(db, "orders"));
                allOrders = [];
                ordersSnap.forEach(docSnap => {
                    allOrders.push({ id: docSnap.id, ...docSnap.data() });
                });
                renderOrders();

                // جلب المنتجات للإدارة والتعديل
                const prodSnap = await getDocs(collection(db, "products"));
                allProducts = [];
                prodSnap.forEach(docSnap => {
                    allProducts.push({ id: docSnap.id, ...docSnap.data() });
                });
                renderManageProducts();

                // جلب خيارات التوصيل
                const delSnap = await getDocs(collection(db, "delivery_options"));
                const delContainer = document.getElementById('currentDeliveryList');
                delContainer.innerHTML = '';
                delSnap.forEach(docSnap => {
                    const d = docSnap.id;
                    const data = docSnap.data();
                    delContainer.innerHTML += `
                        <div style="display:flex; justify-content:space-between; align-items:center; background:#1e293b; padding:8px 12px; border-radius:6px; margin-bottom:6px; font-size:13px;">
                            <span><strong>[فرع ${data.area}]</strong> ${data.name} - ${data.price} ج.س</span>
                            <button onclick="deleteDelivery('${d}')" style="background:#dc2626; color:#fff; border:none; padding:4px 8px; border-radius:4px; cursor:pointer; font-size:11px;">حذف</button>
                        </div>
                    `;
                });
            } catch (e) {
                console.error("Error loading admin data", e);
            }
        }

        window.switchBranchTab = function(branch) {
            currentBranch = branch;
            document.querySelectorAll('.branch-tab').forEach(t => {
                t.classList.remove('active');
                if(t.innerText.includes(branch)) t.classList.add('active');
            });
            renderOrders();
        };

        function renderOrders() {
            const container = document.getElementById('ordersListContainer');
            const filtered = allOrders.filter(o => (o.branch || 'عطبرة') === currentBranch);

            if (filtered.length === 0) {
                container.innerHTML = `<p style="text-align:center; color:#94a3b8; padding:20px;">لا توجد طلبات واردة لفرع ${currentBranch} حالياً</p>`;
                return;
            }

            container.innerHTML = '';
            filtered.forEach((o, index) => {
                let itemsHtml = '';
                if (o.items && Array.isArray(o.items)) {
                    o.items.forEach(it => {
                        itemsHtml += `
                            <div class="order-item-row">
                                <img src="${it.img}" class="order-item-img" onerror="this.src='https://via.placeholder.com/50'">
                                <div>
                                    <strong>${it.name}</strong><br>
                                    <span style="color:#38bdf8;">المقاس: ${it.size} | اللون: ${it.color} | السعر: ${it.price} ج.س</span>
                                </div>
                            </div>
                        `;
                    });
                }

                container.innerHTML += `
                    <div class="order-card">
                        <div class="order-header">
                            <span style="font-weight:bold; color:#fbbf24;">طلب رقم #${index + 1} (${o.date || 'وقت غير مسجل'})</span>
                            <button onclick="deleteOrder('${o.id}')" style="background:#dc2626; color:#fff; border:none; padding:4px 8px; border-radius:4px; cursor:pointer; font-size:11px;">حذف الطلب</button>
                        </div>
                        <div class="order-details">
                            <div><strong>المستلم:</strong> ${o.customerName}</div>
                            <div><strong>الهاتف:</strong> ${o.customerPhone} ${o.customerPhone2 !== 'لا يوجد' ? ' / ' + o.customerPhone2 : ''}</div>
                            <div><strong>العنوان:</strong> ${o.customerAddress}</div>
                            <div><strong>التوصيل:</strong> ${o.deliveryService}</div>
                            <div style="margin-top:8px; font-weight:bold; color:#38bdf8;">المنتجات المطلوبة (مع الصور):</div>
                            ${itemsHtml}
                            <div style="margin-top:10px; font-weight:bold; color:#4ade80; font-size:14px;">الإجمالي الكلي: ${o.totalAmount} ج.س</div>
                            ${o.customerNotes !== 'لا توجد ملاحظات' ? `<div style="margin-top:4px; color:#fbbf24;">ملاحظة الزبون: ${o.customerNotes}</div>` : ''}
                        </div>
                    </div>
                `;
            });
        }

        function renderManageProducts() {
            const container = document.getElementById('manageProductsList');
            if(allProducts.length === 0) {
                container.innerHTML = `<p style="text-align:center; color:#94a3b8; font-size:12px;">لا توجد عروض مضافة حالياً</p>`;
                return;
            }

            container.innerHTML = '';
            allProducts.forEach(p => {
                container.innerHTML += `
                    <div class="manage-product-row">
                        <div style="display:flex; align-items:center; gap:8px;">
                            <img src="${p.img}" style="width:35px; height:35px; object-fit:cover; border-radius:4px;">
                            <div><strong>${p.name}</strong> <span style="color:#94a3b8; font-size:11px;">(${p.area} - ${p.category})</span> - ${p.price} ج.س</div>
                        </div>
                        <div style="display:flex; gap:5px;">
                            <button onclick="editProduct('${p.id}')" class="btn btn-edit" style="padding:4px 8px; font-size:11px;">تعديل</button>
                            <button onclick="deleteProduct('${p.id}')" class="btn btn-danger" style="padding:4px 8px; font-size:11px;">حذف</button>
                        </div>
                    </div>
                `;
            });
        }

        window.onload = () => {
            loadAdminData();
        };
    </script>
</head>
<body>

    <div class="container">
        <h1>لوحة تحكم المشرف - Mohammed Store</h1>

        <!-- 1. إضافة أو تعديل عرض -->
        <div class="card">
            <div class="card-title">إضافة أو تعديل عرض في المتجر</div>
            <form id="productForm" onsubmit="event.preventDefault(); saveProduct();">
                <div class="form-group">
                    <label>اسم العرض أو المنتج</label>
                    <input type="text" id="pName" placeholder="مثال: تيشرت شبابي راقي">
                </div>
                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px;">
                    <div class="form-group">
                        <label>السعر (ج.س)</label>
                        <input type="number" id="pPrice" placeholder="مثال: 15000">
                    </div>
                    <div class="form-group">
                        <label>الفرع المستهدف</label>
                        <select id="pArea">
                            <option value="عطبرة">فرع عطبرة</option>
                            <option value="أمدرمان">فرع أمدرمان</option>
                            <option value="بورتسودان">فرع بورتسودان</option>
                        </select>
                    </div>
                </div>
                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px;">
                    <div class="form-group">
                        <label>القسم</label>
                        <select id="pCategory">
                            <option value="الشبابي">الشبابي</option>
                            <option value="أطفالي">أطفالي</option>
                            <option value="اسبورتات">اسبورتات</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>رابط الصورة (Image URL)</label>
                        <input type="text" id="pImg" placeholder="رابط الصورة المباشر">
                    </div>
                </div>
                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px;">
                    <div class="form-group">
                        <label>المقاسات المتاحة</label>
                        <input type="text" id="pSizes" placeholder="مثال: S, M, L أو 41, 42">
                    </div>
                    <div class="form-group">
                        <label>الألوان المتاحة</label>
                        <input type="text" id="pColors" placeholder="مثال: أسود، أبيض">
                    </div>
                </div>
                <div style="display: flex; gap: 10px;">
                    <button type="submit" id="submitProductBtn" class="btn">نشر العرض في المتجر</button>
                    <button type="button" id="cancelEditBtn" class="btn btn-danger hidden" onclick="cancelEdit()" style="width: auto;">إلغاء التعديل</button>
                </div>
            </form>
        </div>

        <!-- قائمة إدارة وتعديل المنتجات الحالية -->
        <div class="card">
            <div class="card-title">إدارة وتعديل العروض الحالية</div>
            <div id="manageProductsList" style="max-height: 200px; overflow-y: auto;"></div>
        </div>

        <!-- 2. إدارة وتحديد أسعار التوصيل -->
        <div class="card">
            <div class="card-title">إدارة أسعار وطرق التوصيل للفروع</div>
            <form id="deliveryForm" onsubmit="event.preventDefault(); addNewDelivery();">
                <div style="display: grid; grid-template-columns: 2fr 1fr 1fr; gap: 10px;">
                    <div class="form-group">
                        <label>اسم منطقة التوصيل</label>
                        <input type="text" id="dName" placeholder="مثال: وسط المدينة">
                    </div>
                    <div class="form-group">
                        <label>السعر (ج.س)</label>
                        <input type="number" id="dPrice" placeholder="مثال: 2000">
                    </div>
                    <div class="form-group">
                        <label>الفرع</label>
                        <select id="dArea">
                            <option value="عطبرة">عطبرة</option>
                            <option value="أمدرمان">أمدرمان</option>
                            <option value="بورتسودان">بورتسودان</option>
                        </select>
                    </div>
                </div>
                <button type="submit" class="btn" style="background: #2563eb; margin-top: 5px;">إضافة خيار التوصيل</button>
            </form>
            <div style="margin-top: 15px;" id="currentDeliveryList"></div>
        </div>

        <!-- 3. عرض الطلبات مفصولة حسب الفروع مع الصور -->
        <div class="card">
            <div class="card-title">سجل الطلبات الواردة (حسب الفرع والصور)</div>
            
            <div class="branch-tabs">
                <button class="branch-tab active" onclick="switchBranchTab('عطبرة')">فرع عطبرة</button>
                <button class="branch-tab" onclick="switchBranchTab('أمدرمان')">فرع أمدرمان</button>
                <button class="branch-tab" onclick="switchBranchTab('بورتسودان')">فرع بورتسودان</button>
            </div>

            <div id="ordersListContainer">
                <p style="text-align:center; color:#94a3b8; padding:20px;">جاري تحميل الطلبات...</p>
            </div>
        </div>
    </div>

</body>
</html>
