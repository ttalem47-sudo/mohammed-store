<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة التحكم - Mohammed Store</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Tajawal', sans-serif; }
        body { background: #0f172a; color: #f8fafc; padding: 20px; min-height: 100vh; }
        
        .container { max-width: 900px; margin: 0 auto; }
        
        h1 { color: #fbbf24; text-align: center; margin-bottom: 25px; font-weight: 800; font-size: 24px; }
        
        .card {
            background: rgba(30, 41, 59, 0.85);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 16px;
            padding: 20px;
            margin-bottom: 25px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.3);
        }
        
        .card-title { font-size: 18px; font-weight: 800; color: #38bdf8; margin-bottom: 15px; border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 8px; }
        
        .form-group { margin-bottom: 12px; }
        .form-group label { display: block; font-size: 13px; font-weight: 700; margin-bottom: 5px; color: #cbd5e1; }
        .form-group input, .form-group select, .form-group textarea {
            width: 100%; padding: 10px; border: 1px solid rgba(255,255,255,0.2);
            border-radius: 8px; background: #0f172a; color: #fff; font-size: 14px;
        }
        
        .btn {
            background: #d97706; color: white; border: none; padding: 12px 20px;
            border-radius: 8px; font-weight: 800; cursor: pointer; width: 100%; font-size: 15px;
            transition: background 0.2s;
        }
        .btn:hover { background: #b45309; }

        .branch-tabs {
            display: flex; gap: 10px; margin-bottom: 20px; overflow-x: auto; padding-bottom: 5px;
        }
        .branch-tab {
            background: #1e293b; color: #cbd5e1; border: 1px solid rgba(255,255,255,0.15);
            padding: 10px 20px; border-radius: 10px; font-weight: 700; cursor: pointer; white-space: nowrap;
        }
        .branch-tab.active { background: #d97706; color: white; border-color: #d97706; }

        .order-card {
            background: #1e293b; border: 1px solid rgba(255,255,255,0.1); border-radius: 12px; padding: 15px; margin-bottom: 15px;
        }
        .order-header {
            display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 8px; margin-bottom: 10px; font-size: 14px;
        }
        .order-details { font-size: 13px; color: #cbd5e1; line-height: 1.6; }
        .order-items-list { background: #0f172a; padding: 8px; border-radius: 6px; margin-top: 8px; font-size: 12px; }
        
        .product-row {
            display: flex; justify-content: space-between; align-items: center; background: #1e293b; padding: 8px 12px; border-radius: 6px; margin-bottom: 6px; font-size: 13px;
        }
    </style>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, addDoc, getDocs, deleteDoc, doc, updateDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBgKitAdhuq2B2iGGuMKSsXd4loF",
            authDomain: "mohammed-store-59677.firebaseapp.com",
            projectId: "mohammed-store-59677",
            storageBucket: "mohammed-store-59677.firebasestorage.app",
            messagingSenderId: "276394997556",
            appId: "1:276394997556:web:f7e495d9d02131f"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        let allOrders = [];
        let allProducts = [];
        let currentSelectedBranch = 'عطبرة';
        let editingProductId = null;

        // تحويل الصورة المرفوعة من المعرض إلى Base64
        window.handleImageUpload = function(event) {
            const file = event.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    document.getElementById('pImg').value = e.target.result;
                };
                reader.readAsDataURL(file);
            }
        };

        window.addNewProduct = async function() {
            const name = document.getElementById('pName').value.trim();
            const price = document.getElementById('pPrice').value.trim();
            const area = document.getElementById('pArea').value;
            const img = document.getElementById('pImg').value.trim();
            const stock = document.getElementById('pStock').value;
            const adminNote = document.getElementById('pNote').value.trim();
            const sizes = document.getElementById('pSizes').value.trim();
            const colors = document.getElementById('pColors').value.trim();

            if (!name || !price || !img) {
                alert('يرجى ملء الحقول الأساسية (اسم المنتج، السعر، رابط الصورة أو رفعها من المعرض)');
                return;
            }

            try {
                if (editingProductId) {
                    await updateDoc(doc(db, "products", editingProductId), { name, price, area, img, stock, adminNote, sizes, colors });
                    alert('تمت تعديل العرض بنجاح!');
                    editingProductId = null;
                    document.getElementById('submitBtn').innerText = 'نشر العرض في المتجر';
                } else {
                    await addDoc(collection(db, "products"), { name, price, area, img, stock, adminNote, sizes, colors });
                    alert('تمت إضافة العرض بنجاح!');
                }
                document.getElementById('productForm').reset();
                loadAdminData();
            } catch (e) {
                console.error(e);
                alert('حدث خطأ أثناء الحفظ');
            }
        };

        window.editProduct = function(id) {
            const p = allProducts.find(item => item.id === id);
            if (!p) return;
            editingProductId = id;
            document.getElementById('pName').value = p.name || '';
            document.getElementById('pPrice').value = p.price || '';
            document.getElementById('pArea').value = p.area || 'عطبرة';
            document.getElementById('pImg').value = p.img || '';
            document.getElementById('pStock').value = p.stock || 'متوفر';
            document.getElementById('pNote').value = p.adminNote || '';
            document.getElementById('pSizes').value = p.sizes || '';
            document.getElementById('pColors').value = p.colors || '';
            document.getElementById('submitBtn').innerText = 'تعديل العرض الحالي';
            window.scrollTo({ top: 0, behavior: 'smooth' });
        };

        window.deleteProduct = async function(id) {
            if (confirm('هل أنت متأكد من حذف هذا العرض؟')) {
                await deleteDoc(doc(db, "products", id));
                loadAdminData();
            }
        };

        window.addNewDelivery = async function() {
            const name = document.getElementById('dName').value.trim();
            const price = document.getElementById('dPrice').value.trim();
            const area = document.getElementById('dArea').value;

            if (!name || !price) {
                alert('يرجى كتابة اسم وسيلة التوصيل والسعر');
                return;
            }

            try {
                await addDoc(collection(db, "delivery_options"), { name, price: Number(price), area });
                alert('تمت إضافة خيار التوصيل بنجاح!');
                document.getElementById('deliveryForm').reset();
                loadAdminData();
            } catch (e) {
                console.error(e);
            }
        };

        async function loadAdminData() {
            try {
                const ordersSnap = await getDocs(collection(db, "orders"));
                allOrders = [];
                ordersSnap.forEach(docSnap => {
                    allOrders.push({ id: docSnap.id, ...docSnap.data() });
                });
                renderOrders();

                const productsSnap = await getDocs(collection(db, "products"));
                allProducts = [];
                const productsListContainer = document.getElementById('currentProductsList');
                if (productsListContainer) productsListContainer.innerHTML = '';
                
                productsSnap.forEach(docSnap => {
                    const pData = { id: docSnap.id, ...docSnap.data() };
                    allProducts.push(pData);
                    if (productsListContainer) {
                        productsListContainer.innerHTML += `
                            <div class="product-row">
                                <span><strong>[فرع ${pData.area}]</strong> ${pData.name} - ${pData.price} ج.س</span>
                                <div>
                                    <button onclick="editProduct('${pData.id}')" style="background:#2563eb; color:#fff; border:none; padding:4px 8px; border-radius:4px; cursor:pointer; font-size:11px; margin-left:4px;">تعديل</button>
                                    <button onclick="deleteProduct('${pData.id}')" style="background:#dc2626; color:#fff; border:none; padding:4px 8px; border-radius:4px; cursor:pointer; font-size:11px;">حذف</button>
                                </div>
                            </div>
                        `;
                    }
                });

                const delSnap = await getDocs(collection(db, "delivery_options"));
                const delContainer = document.getElementById('currentDeliveryList');
                delContainer.innerHTML = '';
                delSnap.forEach(docSnap => {
                    const d = docSnap.id;
                    const data = docSnap.data();
                    delContainer.innerHTML += `
                        <div style="display:flex; justify-content:space-between; align-items:center; background:#1e293b; padding:8px 12px; border-radius:6px; margin-bottom:6px; font-size:13px;">
                            <span><strong>[فرع ${data.area}]</strong> ${data.name} - ${data.price} ج.س</span>
                            <button onclick="deleteDelivery('${d}')" style="background:#dc2626; color:#fff; border:none; padding:4px 8px; border-radius:4px; cursor:pointer; font-size:11px;">حذف</button>
                        </div>
                    `;
                });
            } catch (e) {
                console.error("Error loading admin data", e);
            }
        }

        window.deleteDelivery = async function(id) {
            if (confirm('هل أنت متأكد من حذف خيار التوصيل هذا؟')) {
                await deleteDoc(doc(db, "delivery_options", id));
                loadAdminData();
            }
        };

        window.deleteOrder = async function(id) {
            if (confirm('هل تريد حذف هذا الطلب؟')) {
                await deleteDoc(doc(db, "orders", id));
                loadAdminData();
            }
        };

        window.switchBranchTab = function(branchName) {
            currentSelectedBranch = branchName;
            document.querySelectorAll('.branch-tab').forEach(tab => {
                tab.classList.remove('active');
                if (tab.innerText.includes(branchName)) tab.classList.add('active');
            });
            renderOrders();
        };

        function renderOrders() {
            const container = document.getElementById('ordersListContainer');
            const filteredOrders = allOrders.filter(o => (o.branch || 'عطبرة') === currentSelectedBranch);

            if (filteredOrders.length === 0) {
                container.innerHTML = `<p style="text-align:center; color:#94a3b8; padding:20px;">لا توجد طلبات واردة لفرع ${currentSelectedBranch} حالياً</p>`;
                return;
            }

            container.innerHTML = '';
            filteredOrders.forEach((o, index) => {
                let itemsHtml = '';
                if (o.items && Array.isArray(o.items)) {
                    o.items.forEach(it => {
                        itemsHtml += `
                            <div style="display: flex; align-items: center; gap: 10px; margin-bottom: 6px; border-bottom: 1px dashed rgba(255,255,255,0.1); padding-bottom: 6px;">
                                ${it.img ? `<img src="${it.img}" style="width: 40px; height: 40px; object-fit: cover; border-radius: 6px; border: 1px solid rgba(255,255,255,0.2);" alt="صورة المنتج">` : ''}
                                <div>
                                    <div>• ${it.name}</div>
                                    <div style="font-size: 11px; color: #94a3b8;">المقاس: <strong>${it.size}</strong> | اللون: <strong>${it.color}</strong></div>
                                </div>
                            </div>
                        `;
                    });
                }

                container.innerHTML += `
                    <div class="order-card">
                        <div class="order-header">
                            <span style="font-weight:bold; color:#fbbf24;">طلب رقم #${index + 1} (${o.date || 'وقت غير مسجل'})</span>
                            <button onclick="deleteOrder('${o.id}')" style="background:#dc2626; color:#fff; border:none; padding:4px 8px; border-radius:4px; cursor:pointer; font-size:11px;">حذف الطلب</button>
                        </div>
                        <div class="order-details">
                            <div><strong>المستلم:</strong> ${o.customerName}</div>
                            <div><strong>الهاتف:</strong> ${o.customerPhone} ${o.customerPhone2 !== 'لا يوجد' ? ' / ' + o.customerPhone2 : ''}</div>
                            <div><strong>العنوان:</strong> ${o.customerAddress}</div>
                            <div><strong>التوصيل:</strong> ${o.deliveryService}</div>
                            <div class="order-items-list">
                                <div style="font-weight:bold; color:#38bdf8; margin-bottom:6px;">المنتجات والقطع المطلوبة:</div>
                                ${itemsHtml}
                            </div>
                            <div style="margin-top:8px; font-weight:bold; color:#4ade80;">الإجمالي الكلي: ${o.totalAmount} ج.س</div>
                            ${o.customerNotes !== 'لا توجد ملاحظات' ? `<div style="margin-top:4px; color:#fbbf24;">ملاحظة الزبون: ${o.customerNotes}</div>` : ''}
                        </div>
                    </div>
                `;
            });
        }

        window.onload = () => {
            loadAdminData();
        };
    </script>
</head>
<body>

    <div class="container">
        <h1>لوحة تحكم المشرف - Mohammed Store</h1>

        <!-- 1. إضافة أو تعديل عرض -->
        <div class="card">
            <div class="card-title">إضافة عرض أو منتج جديد / أو تعديله</div>
            <form id="productForm" onsubmit="event.preventDefault(); addNewProduct();">
                <div class="form-group">
                    <label>اسم العرض أو المنتج</label>
                    <input type="text" id="pName" placeholder="مثال: حذاء رياضي راقي">
                </div>
                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px;">
                    <div class="form-group">
                        <label>السعر (ج.س)</label>
                        <input type="number" id="pPrice" placeholder="مثال: 15000">
                    </div>
                    <div class="form-group">
                        <label>الفرع المستهدف</label>
                        <select id="pArea">
                            <option value="عطبرة">فرع عطبرة</option>
                            <option value="أمدرمان">فرع أمدرمان</option>
                            <option value="بورتسودان">فرع بورتسودان</option>
                        </select>
                    </div>
                </div>
                <div class="form-group">
                    <label>رابط الصورة (Image URL) أو اختر من المعرض</label>
                    <div style="display: flex; gap: 8px;">
                        <input type="text" id="pImg" placeholder="رابط الصورة المباشر أو سيتم تعبئته تلقائياً من المعرض">
                        <input type="file" id="imageGalleryInput" accept="image/*" onchange="handleImageUpload(event)" style="display: none;">
                        <button type="button" onclick="document.getElementById('imageGalleryInput').click();" style="background: #334155; color: #fff; border: 1px solid rgba(255,255,255,0.2); padding: 0 15px; border-radius: 8px; cursor: pointer; white-space: nowrap; font-size: 13px;">اختر من المعرض</button>
                    </div>
                </div>
                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px;">
                    <div class="form-group">
                        <label>حالة الكمية</label>
                        <select id="pStock">
                            <option value="متوفر">متوفر بكثرة</option>
                            <option value="محدود">كمية محدودة</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>ملاحظة الإدارة (اختياري)</label>
                        <input type="text" id="pNote" placeholder="مثال: العرض ساري حتى الستوك القادم">
                    </div>
                </div>
                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px;">
                    <div class="form-group">
                        <label>المقاسات المتاحة</label>
                        <input type="text" id="pSizes" placeholder="مثال: 41, 42, 43 أو S, M, L">
                    </div>
                    <div class="form-group">
                        <label>الألوان المتاحة</label>
                        <input type="text" id="pColors" placeholder="مثال: أسود، أبيض، كحلي">
                    </div>
                </div>
                <button type="submit" id="submitBtn" class="btn">نشر العرض في المتجر</button>
            </form>
            <div style="margin-top: 15px;">
                <div style="font-size: 13px; font-weight: bold; color: #cbd5e1; margin-bottom: 8px;">المنتجات والعروض الحالية (للتعديل أو الحذف):</div>
                <div id="currentProductsList"></div>
            </div>
        </div>

        <!-- 2. إدارة وتحديد أسعار التوصيل -->
        <div class="card">
            <div class="card-title">إدارة أسعار وطرق التوصيل للفروع</div>
            <form id="deliveryForm" onsubmit="event.preventDefault(); addNewDelivery();">
                <div style="display: grid; grid-template-columns: 2fr 1fr 1fr; gap: 10px;">
                    <div class="form-group">
                        <label>اسم منطقة التوصيل</label>
                        <input type="text" id="dName" placeholder="مثال: وسط المدينة / الأحياء الشمالية">
                    </div>
                    <div class="form-group">
                        <label>السعر (ج.س)</label>
                        <input type="number" id="dPrice" placeholder="مثال: 2000">
                    </div>
                    <div class="form-group">
                        <label>الفرع</label>
                        <select id="dArea">
                            <option value="عطبرة">عطبرة</option>
                            <option value="أمدرمان">أمدرمان</option>
                            <option value="بورتسودان">بورتسودان</option>
                        </select>
                    </div>
                </div>
                <button type="submit" class="btn" style="background: #2563eb; margin-top: 5px;">إضافة خيار التوصيل</button>
            </form>
            <div style="margin-top: 15px;">
                <div style="font-size: 13px; font-weight: bold; color: #cbd5e1; margin-bottom: 8px;">الخيارات الحالية المسجلة:</div>
                <div id="currentDeliveryList"></div>
            </div>
        </div>

        <!-- 3. عرض الطلبات مفصولة حسب الفروع -->
        <div class="card">
            <div class="card-title">سجل الطلبات الواردة (حسب الفرع)</div>
            
            <div class="branch-tabs">
                <button class="branch-tab active" onclick="switchBranchTab('عطبرة')">فرع عطبرة</button>
                <button class="branch-tab" onclick="switchBranchTab('أمدرمان')">فرع أمدرمان</button>
                <button class="branch-tab" onclick="switchBranchTab('بورتسودان')">فرع بورتسودان</button>
            </div>

            <div id="ordersListContainer">
                <p style="text-align:center; color:#94a3b8; padding:20px;">جاري تحميل الطلبات...</p>
            </div>
        </div>
    </div>

</body>
</html>
