<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mohamed Store - المتجر</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Tajawal', sans-serif; }
        body {
            background: url('1790521573595.jpg') no-repeat center center fixed;
            background-size: cover;
            color: #f8fafc;
            padding-bottom: 90px;
        }
        
        header {
            background: rgba(15, 23, 42, 0.9);
            backdrop-filter: blur(12px);
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .logo { font-size: 20px; font-weight: 800; color: #fbbf24; }
        
        .area-select-container {
            padding: 15px 20px;
            background: rgba(30, 41, 59, 0.85);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid rgba(255,255,255,0.05);
        }
        .area-select {
            width: 100%;
            padding: 10px;
            border-radius: 8px;
            border: 1px solid rgba(255,255,255,0.2);
            background: #0f172a;
            color: #fff;
            font-size: 15px;
            font-weight: bold;
            outline: none;
        }

        .categories-bar {
            display: flex;
            gap: 8px;
            padding: 12px 20px;
            overflow-x: auto;
            background: rgba(30, 41, 59, 0.85);
            backdrop-filter: blur(12px);
            white-space: nowrap;
        }

        .cat-chip {
            background: #0f172a;
            color: #cbd5e1;
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 13px;
            cursor: pointer;
            border: 1px solid rgba(255,255,255,0.1);
        }

        .cat-chip.active {
            background: #d97706;
            color: white;
            border-color: #d97706;
            font-weight: bold;
        }

        .products-grid {
            padding: 20px;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
            gap: 15px;
        }

        .product-card {
            background: rgba(30, 41, 59, 0.9);
            backdrop-filter: blur(12px);
            border-radius: 12px;
            overflow: hidden;
            border: 1px solid rgba(255,255,255,0.08);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .product-img {
            width: 100%;
            height: 140px;
            object-fit: contain;
            background: #000;
        }

        .product-body { padding: 12px; }
        .product-title { font-size: 14px; font-weight: bold; margin-bottom: 6px; }
        .product-price { font-size: 14px; color: #fbbf24; font-weight: 800; margin-bottom: 8px; }
        
        .btn-details {
            width: 100%;
            padding: 8px;
            background: #0284c7;
            color: white;
            border: none;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            font-size: 13px;
        }

        .cart-float-btn {
            position: fixed;
            bottom: 20px;
            left: 20px;
            background: #16a34a;
            color: white;
            padding: 12px 20px;
            border-radius: 30px;
            font-weight: bold;
            box-shadow: 0 4px 15px rgba(0,0,0,0.4);
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            z-index: 1000;
        }

        .modal {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(15, 23, 42, 0.85);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 2000;
            padding: 20px;
        }

        .modal-content {
            background: #1e293b;
            width: 100%;
            max-width: 450px;
            border-radius: 16px;
            padding: 20px;
            max-height: 90vh;
            overflow-y: auto;
            border: 1px solid rgba(255,255,255,0.1);
        }

        .form-group { margin-bottom: 12px; }
        label { display: block; margin-bottom: 5px; font-size: 13px; color: #cbd5e1; font-weight: bold; }
        input, select, textarea {
            width: 100%;
            padding: 10px;
            border-radius: 8px;
            border: 1px solid rgba(255,255,255,0.2);
            background: #0f172a;
            color: #fff;
            font-size: 14px;
            outline: none;
        }

        .btn-primary {
            width: 100%;
            padding: 12px;
            background: #d97706;
            color: white;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            font-size: 15px;
            margin-top: 10px;
        }

        .badge {
            display: inline-block;
            padding: 3px 8px;
            border-radius: 4px;
            font-size: 11px;
            font-weight: bold;
            margin-bottom: 6px;
        }
        .badge-stock { background: #065f46; color: #34d399; }
        .badge-limited { background: #78350f; color: #fbbf24; }
    </style>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, getDocs, addDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBgKitAdhuq2B2iGGuMKSsXd4loF",
            authDomain: "mohammed-store-59677.firebaseapp.com",
            projectId: "mohammed-store-59677",
            storageBucket: "mohammed-store-59677.firebasestorage.app",
            messagingSenderId: "276394997556",
            appId: "1:276394997556:web:f7e495d9d02131f"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        let allProducts = [];
        let deliveryOptionsMap = {};
        let currentArea = "عطبرة";
        let currentCategory = "الكل";
        let cart = [];
        let selectedProductForDetails = null;

        async function initStore() {
            await loadDeliveryOptions();
            await loadProducts();
        }

        async function loadDeliveryOptions() {
            try {
                const snap = await getDocs(collection(db, "delivery_options"));
                deliveryOptionsMap = {};
                snap.forEach(doc => {
                    const d = doc.data();
                    const area = d.area || "عطبرة";
                    if (!deliveryOptionsMap[area]) {
                        deliveryOptionsMap[area] = [];
                    }
                    deliveryOptionsMap[area].push(d);
                });
            } catch(e) {
                console.error(e);
            }
        }

        async function loadProducts() {
            const grid = document.getElementById('productsGrid');
            try {
                const snap = await getDocs(collection(db, "products"));
                allProducts = [];
                snap.forEach(doc => {
                    allProducts.push({ id: doc.id, ...doc.data() });
                });
                renderAreasDropdown();
                renderCategories();
                filterAndRenderProducts();
            } catch (e) {
                console.error(e);
            }
        }

        function renderAreasDropdown() {
            const selectEl = document.getElementById('areaSelect');
            const areasSet = new Set(["عطبرة", "أمدرمان", "بورتسودان"]);
            allProducts.forEach(p => { if (p.area) areasSet.add(p.area); });
            Object.keys(deliveryOptionsMap).forEach(a => areasSet.add(a));

            selectEl.innerHTML = "";
            areasSet.forEach(area => {
                selectEl.innerHTML += `<option value="${area}" ${area === currentArea ? 'selected' : ''}>${area}</option>`;
            });
        }

        window.changeArea = function(area) {
            currentArea = area;
            currentCategory = "الكل";
            renderCategories();
            filterAndRenderProducts();
        };

        function renderCategories() {
            const bar = document.getElementById('categoriesBar');
            const categories = ["الكل"];
            allProducts.forEach(p => {
                if (p.area === currentArea) {
                    const cat = p.category || "عام";
                    if (!categories.includes(cat)) categories.push(cat);
                }
            });

            bar.innerHTML = "";
            categories.forEach(cat => {
                bar.innerHTML += `<div class="cat-chip ${cat === currentCategory ? 'active' : ''}" onclick="selectCategory('${cat}')">${cat}</div>`;
            });
        }

        window.selectCategory = function(cat) {
            currentCategory = cat;
            renderCategories();
            filterAndRenderProducts();
        };

        function filterAndRenderProducts() {
            const grid = document.getElementById('productsGrid');
            const filtered = allProducts.filter(p => p.area === currentArea && (currentCategory === "الكل" || (p.category || "عام") === currentCategory));

            if (filtered.length === 0) {
                grid.innerHTML = "<p style='grid-column: 1/-1; text-align:center; color:#cbd5e1;'>لا توجد عروض متاحة في هذا الفرع حالياً.</p>";
                return;
            }

            grid.innerHTML = "";
            filtered.forEach(p => {
                const stockBadge = p.stock === 'محدود' ? '<span class="badge badge-limited">كمية محدودة</span>' : '<span class="badge badge-stock">متوفر</span>';
                grid.innerHTML += `
                    <div class="product-card">
                        <div>
                            <img src="${p.img}" class="product-img">
                            <div class="product-body">
                                ${stockBadge}
                                <div class="product-title">${p.name}</div>
                                <div class="product-price">${p.price} ج.س</div>
                            </div>
                        </div>
                        <div style="padding: 0 12px 12px 12px;">
                            <button class="btn-details" onclick="openProductModal('${p.id}')">عرض التفاصيل</button>
                        </div>
                    </div>
                `;
            });
        }

        window.openProductModal = function(id) {
            selectedProductForDetails = allProducts.find(p => p.id === id);
            if (!selectedProductForDetails) return;

            const p = selectedProductForDetails;
            document.getElementById('modalImg').src = p.img;
            document.getElementById('modalTitle').innerText = p.name;
            document.getElementById('modalPrice').innerText = p.price + " ج.س";

            const sizeSelect = document.getElementById('modalSize');
            sizeSelect.innerHTML = "";
            const sizes = (p.sizes || "حسب المتاح").split(',');
            sizes.forEach(s => sizeSelect.innerHTML += `<option value="${s.trim()}">${s.trim()}</option>`);

            const colorSelect = document.getElementById('modalColor');
            colorSelect.innerHTML = "";
            const colors = (p.colors || "جميع الألوان متوفرة").split(',');
            colors.forEach(c => colorSelect.innerHTML += `<option value="${c.trim()}">${c.trim()}</option>`);

            const customContainer = document.getElementById('modalCustomFields');
            customContainer.innerHTML = "";
            if (p.customFields && p.customFields.length > 0) {
                p.customFields.forEach(cf => {
                    customContainer.innerHTML += `<div style="font-size:13px; color:#38bdf8; margin-bottom:4px;"><strong>${cf.name}:</strong> ${cf.value}</div>`;
                });
            }

            document.getElementById('productModal').style.display = 'flex';
        };

        window.closeProductModal = function() {
            document.getElementById('productModal').style.display = 'none';
        };

        window.addToCartFromModal = function() {
            if (!selectedProductForDetails) return;
            const size = document.getElementById('modalSize').value;
            const color = document.getElementById('modalColor').value;

            cart.push({
                ...selectedProductForDetails,
                size,
                color
            });

            updateCartCount();
            closeProductModal();
            alert('تم إضافة المنتج إلى السلة بنجاح!');
        };

        function updateCartCount() {
            document.getElementById('cartCount').innerText = cart.length;
        }

        window.openCheckoutModal = function() {
            if (cart.length === 0) {
                alert('سلة المشتريات فارغة!');
                return;
            }

            const deliverySelect = document.getElementById('checkoutDelivery');
            deliverySelect.innerHTML = "";
            const options = deliveryOptionsMap[currentArea] || [];
            
            if (options.length === 0) {
                deliverySelect.innerHTML = `<option value="توصيل أساسي|0">توصيل أساسي (0 ج.س)</option>`;
            } else {
                options.forEach(opt => {
                    deliverySelect.innerHTML += `<option value="${opt.name}|${opt.price}">${opt.name} (${opt.price} ج.س)</option>`;
                });
            }

            renderCartSummary();
            document.getElementById('checkoutModal').style.display = 'flex';
        };

        window.closeCheckoutModal = function() {
            document.getElementById('checkoutModal').style.display = 'none';
        };

        function renderCartSummary() {
            const list = document.getElementById('cartItemsList');
            list.innerHTML = "";
            let total = 0;

            cart.forEach((item, index) => {
                total += Number(item.price);
                list.innerHTML += `
                    <div style="display:flex; justify-content:space-between; align-items:center; background:#0f172a; padding:8px; border-radius:6px; margin-bottom:6px; font-size:13px;">
                        <div>
                            <div style="font-weight:bold;">${item.name}</div>
                            <div style="color:#fbbf24;">${item.price} ج.س | مقاس: ${item.size} | لون: ${item.color}</div>
                        </div>
                        <button onclick="removeFromCart(${index})" style="background:#ef4444; color:white; border:none; padding:4px 8px; border-radius:4px; cursor:pointer;">حذف</button>
                    </div>
                `;
            });

            const deliveryVal = document.getElementById('checkoutDelivery').value.split('|');
            const deliveryPrice = Number(deliveryVal[1]) || 0;
            const grandTotal = total + deliveryPrice;

            document.getElementById('cartTotalSummary').innerText = `المجموع الكلي: ${grandTotal} ج.س (يشمل التوصيل)`;
        }

        window.updateCheckoutTotal = function() {
            renderCartSummary();
        };

        window.removeFromCart = function(index) {
            cart.splice(index, 1);
            updateCartCount();
            if (cart.length === 0) {
                closeCheckoutModal();
            } else {
                renderCartSummary();
            }
        };

        window.submitOrder = async function() {
            const name = document.getElementById('custName').value.trim();
            const phone = document.getElementById('custPhone').value.trim();
            const phone2 = document.getElementById('custPhone2').value.trim() || "لا يوجد";
            const address = document.getElementById('custAddress').value.trim();
            const notes = document.getElementById('custNotes').value.trim() || "لا توجد ملاحظات";
            const deliveryInfo = document.getElementById('checkoutDelivery').value.split('|');
            const deliveryService = deliveryInfo[0];
            const deliveryPrice = Number(deliveryInfo[1]) || 0;

            if (!name || !phone || !address) {
                alert('يرجى ملء الحقول الإجبارية (الاسم، الهاتف، العنوان).');
                return;
            }

            let productsTotal = 0;
            cart.forEach(item => productsTotal += Number(item.price));
            const totalAmount = productsTotal + deliveryPrice;

            try {
                await addDoc(collection(db, "orders"), {
                    customerName: name,
                    customerPhone: phone,
                    customerPhone2: phone2,
                    customerAddress: address,
                    customerNotes: notes,
                    deliveryService: `${deliveryService} (${deliveryPrice} ج.س)`,
                    items: cart,
                    totalAmount,
                    area: currentArea,
                    timestamp: new Date()
                });

                alert('تم إرسال طلبك بنجاح! سنتواصل معك قريباً لتأكيد الطلب.');
                cart = [];
                updateCartCount();
                closeCheckoutModal();
                document.getElementById('custName').value = '';
                document.getElementById('custPhone').value = '';
                document.getElementById('custPhone2').value = '';
                document.getElementById('custAddress').value = '';
                document.getElementById('custNotes').value = '';
            } catch(e) {
                alert('حدث خطأ أثناء إرسال الطلب، حاول مرة أخرى.');
            }
        };

        window.onload = initStore;
    </script>
</head>
<body>

    <header>
        <div class="logo">Mohamed Store</div>
    </header>

    <div class="area-select-container">
        <label style="margin-bottom: 5px; font-size: 13px; color: #cbd5e1;">اختر فرع المدينة:</label>
        <select class="area-select" id="areaSelect" onchange="changeArea(this.value)">
            <option value="عطبرة">عطبرة</option>
            <option value="أمدرمان">أمدرمان</option>
            <option value="بورتسودان">بورتسودان</option>
        </select>
    </div>

    <div class="categories-bar" id="categoriesBar"></div>

    <div class="products-grid" id="productsGrid"></div>

    <div class="cart-float-btn" onclick="openCheckoutModal()">
        🛒 سلة المشتريات (<span id="cartCount">0</span>)
    </div>

    <!-- نافذة تفاصيل المنتج -->
    <div class="modal" id="productModal">
        <div class="modal-content">
            <img id="modalImg" style="width:100%; height:200px; object-fit:contain; background:#000; border-radius:8px; margin-bottom:12px;">
            <h2 id="modalTitle" style="font-size: 18px; color:#fff; margin-bottom:6px;"></h2>
            <div id="modalPrice" style="font-size: 16px; color:#fbbf24; font-weight:bold; margin-bottom:12px;"></div>
            
            <div id="modalCustomFields" style="margin-bottom: 12px;"></div>

            <div class="form-group">
                <label>المقاس:</label>
                <select id="modalSize"></select>
            </div>
            <div class="form-group">
                <label>اللون:</label>
                <select id="modalColor"></select>
            </div>

            <button class="btn-primary" onclick="addToCartFromModal()">إضافة إلى السلة</button>
            <button onclick="closeProductModal()" style="width:100%; padding:10px; background:#475569; color:white; border:none; border-radius:8px; margin-top:8px; cursor:pointer;">إغلاق</button>
        </div>
    </div>

    <!-- نافذة إتمام الطلب (Checkout) -->
    <div class="modal" id="checkoutModal">
        <div class="modal-content">
            <h2 style="font-size: 16px; color: #fbbf24; margin-bottom: 12px;">إتمام الطلب</h2>
            
            <div id="cartItemsList" style="max-height: 150px; overflow-y: auto; margin-bottom: 12px;"></div>
            
            <div class="form-group">
                <label>خدمة التوصيل *</label>
                <select id="checkoutDelivery" onchange="updateCheckoutTotal()"></select>
            </div>

            <div style="font-weight: bold; color: #22c55e; margin-bottom: 12px; font-size: 15px;" id="cartTotalSummary"></div>

            <div class="form-group"><label>اسم المستلم *</label><input type="text" id="custName"></div>
            <div class="form-group"><label>رقم الهاتف الأساسي *</label><input type="tel" id="custPhone"></div>
            <div class="form-group"><label>رقم الهاتف الاحتياطي (اختياري)</label><input type="tel" id="custPhone2"></div>
            <div class="form-group"><label>عنوان الاستلام بالتفصيل *</label><textarea id="custAddress" rows="2"></textarea></div>
            <div class="form-group"><label>ملاحظات إضافية (اختياري)</label><textarea id="custNotes" rows="2"></textarea></div>

            <button class="btn-primary" onclick="submitOrder()">تأكيد وإرسال الطلب</button>
            <button onclick="closeCheckoutModal()" style="width:100%; padding:10px; background:#475569; color:white; border:none; border-radius:8px; margin-top:8px; cursor:pointer;">إلغاء</button>
        </div>
    </div>

</body>
</html>
