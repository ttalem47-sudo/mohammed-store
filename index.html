<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mohammed store</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Tajawal', sans-serif; -webkit-tap-highlight-color: transparent; }
        
        body { 
            background: url('Screenshot_٢٠٢٦٠٩٢٧_١٤٤٥٣٩_com_google_android_googlequicksearchbox_GoogleAppActivi_edit_890925498841021') no-repeat center center fixed; 
            background-size: cover;
            color: #f8fafc; 
            min-height: 100vh;
            padding-top: 75px;
            padding-bottom: 30px;
        }

        .navbar {
            position: fixed;
            top: 0; left: 0; right: 0;
            height: 65px;
            background: rgba(15, 23, 42, 0.75);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.15);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 20px;
            z-index: 1000;
            box-shadow: 0 4px 20px rgba(0,0,0,0.3);
        }

        .brand-logo {
            font-size: 20px;
            font-weight: 800;
            color: #38bdf8;
        }

        .tabs-container {
            display: flex;
            gap: 10px;
            padding: 15px 20px;
            overflow-x: auto;
            max-width: 800px;
            margin: 0 auto;
        }

        .tab-btn {
            background: rgba(30, 41, 59, 0.75);
            backdrop-filter: blur(8px);
            color: #cbd5e1;
            border: 1px solid rgba(255, 255, 255, 0.15);
            padding: 10px 20px;
            border-radius: 25px;
            font-weight: 700;
            font-size: 14px;
            cursor: pointer;
            white-space: nowrap;
            transition: all 0.3s ease;
        }

        .tab-btn.active, .tab-btn:hover {
            background: #38bdf8;
            color: #0f172a;
            border-color: #38bdf8;
            box-shadow: 0 0 15px rgba(56, 189, 248, 0.5);
        }

        .container { max-width: 800px; margin: 0 auto; padding: 10px 20px; }
        
        .products-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 20px;
        }

        .product-card {
            background: rgba(15, 23, 42, 0.75);
            backdrop-filter: blur(12px);
            border-radius: 16px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            overflow: hidden;
            box-shadow: 0 8px 32px rgba(0,0,0,0.37);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            animation: fadeInSlide 0.5s ease forwards;
        }

        .product-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 12px 30px rgba(0,0,0,0.5);
        }

        .img-wrapper {
            position: relative;
            width: 100%;
            height: 220px;
            overflow: hidden;
            cursor: pointer;
            background: rgba(15, 23, 42, 0.5);
        }

        .product-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.4s ease;
        }

        .product-details { padding: 15px; }

        .product-title {
            font-size: 16px;
            font-weight: 700;
            margin-bottom: 6px;
            color: #f8fafc;
        }

        .product-price {
            font-size: 18px;
            font-weight: 800;
            color: #38bdf8;
            margin-bottom: 12px;
        }

        .sizes-box {
            display: flex;
            gap: 6px;
            margin-bottom: 15px;
        }

        .size-btn {
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: #cbd5e1;
            padding: 4px 10px;
            border-radius: 6px;
            font-size: 12px;
            cursor: pointer;
        }

        .size-btn.selected {
            background: #38bdf8;
            color: #0f172a;
            border-color: #38bdf8;
            font-weight: bold;
        }

        .btn-order {
            width: 100%;
            background: #2563eb;
            color: white;
            border: none;
            padding: 10px;
            border-radius: 10px;
            font-weight: 700;
            cursor: pointer;
            transition: background 0.2s;
        }

        .btn-order:hover { background: #1d4ed8; }

        .modal {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(15, 23, 42, 0.7);
            backdrop-filter: blur(10px);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 2000;
            padding: 20px;
        }

        .modal-content {
            background: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(16px);
            border-radius: 16px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            width: 100%;
            max-width: 400px;
            padding: 20px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.5);
            animation: zoomIn 0.3s ease;
        }

        .modal-header {
            font-weight: 800;
            font-size: 18px;
            color: #38bdf8;
            margin-bottom: 15px;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            padding-bottom: 10px;
        }

        .form-group {
            margin-bottom: 12px;
        }

        .form-group label {
            display: block;
            font-size: 13px;
            font-weight: 700;
            margin-bottom: 5px;
            color: #cbd5e1;
        }

        .form-group input {
            width: 100%;
            padding: 10px;
            border: 1.5px solid rgba(255,255,255,0.2);
            border-radius: 8px;
            background: rgba(15, 23, 42, 0.9);
            color: #fff;
            font-size: 14px;
        }

        .btn-confirm {
            width: 100%;
            background: #16a34a;
            color: white;
            border: none;
            padding: 12px;
            border-radius: 10px;
            font-weight: 800;
            cursor: pointer;
            margin-top: 10px;
            font-size: 15px;
        }

        .btn-close {
            width: 100%;
            background: transparent;
            color: #94a3b8;
            border: none;
            padding: 8px;
            margin-top: 5px;
            cursor: pointer;
            font-size: 13px;
        }

        @keyframes fadeInSlide {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes zoomIn {
            from { transform: scale(0.9); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }
    </style>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, getDocs } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBgKitAdhuq2B2iGGuMKSsXd4loF",
            authDomain: "mohammed-store-59677.firebaseapp.com",
            projectId: "mohammed-store-59677",
            storageBucket: "mohammed-store-59677.firebasestorage.app",
            messagingSenderId: "276394997556",
            appId: "1:276394997556:web:f7e495d9d02131f"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        let allProducts = [];
        let selectedSizes = {};
        let currentOrder = {};

        async function loadProducts() {
            const grid = document.getElementById('productsGrid');
            try {
                const querySnapshot = await getDocs(collection(db, "products"));
                allProducts = [];
                querySnapshot.forEach(doc => allProducts.push({ id: doc.id, ...doc.data() }));
                
                updateAreaTabs();
                renderProducts(allProducts);
            } catch (e) {
                grid.innerHTML = '<p style="text-align:center; width:100%;">خطأ في تحميل المنتجات</p>';
            }
        }

        function updateAreaTabs() {
            const tabsContainer = document.getElementById('tabsContainer');
            const defaultAreas = ["عطبرة", "أمدرمان", "بورتسودان"];
            const existingAreas = new Set(defaultAreas);

            allProducts.forEach(p => {
                if (p.area) existingAreas.add(p.area);
            });

            let html = `<button class="tab-btn active" onclick="filterArea('all', this)">كل المناطق</button>`;
            existingAreas.forEach(area => {
                html += `<button class="tab-btn" onclick="filterArea('${area}', this)">${area}</button>`;
            });

            tabsContainer.innerHTML = html;
        }

        window.filterArea = function(area, btn) {
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');

            if (area === 'all') {
                renderProducts(allProducts);
            } else {
                const filtered = allProducts.filter(p => p.area === area);
                renderProducts(filtered);
            }
        };

        function renderProducts(products) {
            const grid = document.getElementById('productsGrid');
            grid.innerHTML = "";

            if (products.length === 0) {
                grid.innerHTML = '<p style="text-align:center; grid-column: 1/-1; color: #cbd5e1; padding: 40px; background: rgba(15, 23, 42, 0.6); border-radius: 12px;">لا توجد عروض متوفرة حالياً في هذه المنطقة</p>';
                return;
            }

            products.forEach(p => {
                grid.innerHTML += `
                    <div class="product-card">
                        <div class="img-wrapper" onclick="openPreview('${p.img}')">
                            <img src="${p.img}" class="product-img" alt="${p.name}">
                        </div>
                        <div class="product-details">
                            <h3 class="product-title">${p.name}</h3>
                            <div class="product-price">${p.price} ج.س</div>
                            <div class="sizes-box">
                                <button class="size-btn" onclick="selectSize('${p.id}', 'S', this)">S</button>
                                <button class="size-btn" onclick="selectSize('${p.id}', 'M', this)">M</button>
                                <button class="size-btn" onclick="selectSize('${p.id}', 'L', this)">L</button>
                                <button class="size-btn" onclick="selectSize('${p.id}', 'XL', this)">XL</button>
                            </div>
                            <button class="btn-order" onclick="openOrderModal('${p.name}', '${p.price}', '${p.id}')">طلب العرض عبر واتساب</button>
                        </div>
                    </div>
                `;
            });
        }

        window.selectSize = function(productId, size, btn) {
            const parent = btn.parentElement;
            parent.querySelectorAll('.size-btn').forEach(b => b.classList.remove('selected'));
            btn.classList.add('selected');
            selectedSizes[productId] = size;
        };

        window.openOrderModal = function(name, price, id) {
            currentOrder = {
                name: name,
                price: price,
                size: selectedSizes[id] || 'M (افتراضي)'
            };
            document.getElementById('orderModal').style.display = 'flex';
        };

        window.closeOrderModal = function() {
            document.getElementById('orderModal').style.display = 'none';
        };

        window.submitOrderToWhatsApp = function() {
            const customerName = document.getElementById('custName').value.trim();
            const customerPhone = document.getElementById('custPhone').value.trim();
            const customerAddress = document.getElementById('custAddress').value.trim();

            if (!customerName || !customerPhone || !customerAddress) {
                alert('يرجى كتابة الاسم، رقم الهاتف، والمنطقة/العنوان الدقيق لإتمام الطلب.');
                return;
            }

            // تم تحديث رقم الواتساب الخاص بالمتجر هنا
            const myWhatsAppNumber = "249901358927";

            const text = `طلب جديد - Mohammed store%0A` +
                         `----------------------------%0A` +
                         `المنتج: ${currentOrder.name}%0A` +
                         `المقاس: ${currentOrder.size}%0A` +
                         `السعر: ${currentOrder.price} ج.س%0A` +
                         `----------------------------%0A` +
                         `اسم الزبون: ${customerName}%0A` +
                         `رقم الزبون: ${customerPhone}%0A` +
                         `المنطقة والعنوان الدقيق: ${customerAddress}`;

            window.open(`https://wa.me/${myWhatsAppNumber}?text=${text}`, '_blank');
            closeOrderModal();
        };

        window.openPreview = function(imgSrc) {
            document.getElementById('previewModalImg').src = imgSrc;
            document.getElementById('previewModal').style.display = 'flex';
        };

        window.closePreview = function() {
            document.getElementById('previewModal').style.display = 'none';
        };

        window.onload = loadProducts;
    </script>
</head>
<body>

    <div class="navbar">
        <div class="brand-logo">Mohammed store</div>
    </div>

    <div class="tabs-container" id="tabsContainer">
        <button class="tab-btn active" onclick="filterArea('all', this)">كل المناطق</button>
        <button class="tab-btn" onclick="filterArea('عطبرة', this)">عطبرة</button>
        <button class="tab-btn" onclick="filterArea('أمدرمان', this)">أمدرمان</button>
        <button class="tab-btn" onclick="filterArea('بورتسودان', this)">بورتسودان</button>
    </div>

    <div class="container">
        <div class="products-grid" id="productsGrid">
            <p style="text-align: center; width: 100%; grid-column: 1/-1; color: #fff;">جاري تحميل العروض...</p>
        </div>
    </div>

    <div class="modal" id="orderModal">
        <div class="modal-content">
            <div class="modal-header">تأكيد بيانات الطلب</div>
            <div class="form-group">
                <label>اسمك الكامل</label>
                <input type="text" id="custName" placeholder="مثال: محمد أحمد">
            </div>
            <div class="form-group">
                <label>رقم هاتفك للتواصل</label>
                <input type="tel" id="custPhone" placeholder="مثال: 0912345678">
            </div>
            <div class="form-group">
                <label>المنطقة والعنوان الدقيق</label>
                <input type="text" id="custAddress" placeholder="مثال: عطبرة - حي المطار">
            </div>
            <button class="btn-confirm" onclick="submitOrderToWhatsApp()">إرسال الطلب عبر الواتساب</button>
            <button class="btn-close" onclick="closeOrderModal()">إلغاء</button>
        </div>
    </div>

    <div class="modal" id="previewModal" onclick="closePreview()">
        <div class="modal-content" style="background: transparent; border: none; text-align: center;">
            <img id="previewModalImg" src="" style="max-width: 100%; max-height: 80vh; border-radius: 12px; border: 2px solid #38bdf8; box-shadow: 0 0 20px rgba(56, 189, 248, 0.5);">
        </div>
    </div>

</body>
</html>
