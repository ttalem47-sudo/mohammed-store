<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mohamed Store</title>
    <link rel="icon" href="IMG-20260925-WA0048.jpg">
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Tajawal', sans-serif; -webkit-tap-highlight-color: transparent; }
        
        body { 
            background: url('1790521573595.jpg') no-repeat center center fixed; 
            background-size: cover;
            color: #f8fafc; 
            min-height: 100vh;
            padding-top: 80px;
            padding-bottom: 100px;
        }

        /* --- شاشة الافتتاحية --- */
        #splashScreen {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: #000000;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            transition: opacity 0.6s ease, visibility 0.6s ease;
        }

        #splashScreen.hidden { opacity: 0; visibility: hidden; }

        .splash-logo {
            width: 140px;
            height: auto;
            border-radius: 16px;
            box-shadow: 0 0 25px rgba(217, 119, 6, 0.4);
            animation: pulse 1.5s infinite ease-in-out;
        }

        @keyframes pulse {
            0% { transform: scale(0.95); box-shadow: 0 0 15px rgba(217, 119, 6, 0.3); }
            50% { transform: scale(1.08); box-shadow: 0 0 30px rgba(217, 119, 6, 0.7); }
            100% { transform: scale(0.95); box-shadow: 0 0 15px rgba(217, 119, 6, 0.3); }
        }

        /* --- Navbar --- */
        .navbar {
            position: fixed;
            top: 0; left: 0; right: 0;
            height: 70px;
            background: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.15);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 20px;
            z-index: 1000;
            box-shadow: 0 4px 20px rgba(0,0,0,0.4);
        }

        .brand-container { display: flex; align-items: center; gap: 12px; }
        .brand-logo-img { height: 45px; width: auto; border-radius: 8px; object-fit: contain; }
        .brand-title { font-size: 18px; font-weight: 800; color: #d97706; letter-spacing: 0.5px; }

        .tabs-container {
            display: flex;
            gap: 10px;
            padding: 15px 20px;
            overflow-x: auto;
            max-width: 800px;
            margin: 0 auto;
        }

        .tab-btn {
            background: rgba(30, 41, 59, 0.75);
            backdrop-filter: blur(8px);
            color: #cbd5e1;
            border: 1px solid rgba(255, 255, 255, 0.15);
            padding: 10px 20px;
            border-radius: 25px;
            font-weight: 700;
            font-size: 14px;
            cursor: pointer;
            white-space: nowrap;
            transition: all 0.3s ease;
        }

        .tab-btn.active, .tab-btn:hover {
            background: #d97706;
            color: #ffffff;
            border-color: #d97706;
            box-shadow: 0 0 15px rgba(217, 119, 6, 0.5);
        }

        .container { max-width: 800px; margin: 0 auto; padding: 10px 20px; }
        
        .products-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 20px;
        }

        .product-card {
            background: rgba(15, 23, 42, 0.75);
            backdrop-filter: blur(12px);
            border-radius: 16px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            overflow: hidden;
            box-shadow: 0 8px 32px rgba(0,0,0,0.37);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            position: relative;
        }

        .product-card.selected {
            border: 2px solid #16a34a;
            box-shadow: 0 0 20px rgba(22, 163, 74, 0.4);
        }

        .img-wrapper {
            position: relative;
            width: 100%;
            height: 220px;
            overflow: hidden;
            cursor: pointer;
            background: rgba(15, 23, 42, 0.5);
        }

        .product-img { width: 100%; height: 100%; object-fit: cover; }
        .product-details { padding: 15px; }
        .product-title { font-size: 16px; font-weight: 700; margin-bottom: 6px; color: #f8fafc; }
        .product-price { font-size: 18px; font-weight: 800; color: #fbbf24; margin-bottom: 8px; }

        .product-sizes-info {
            font-size: 13px;
            color: #cbd5e1;
            background: rgba(255, 255, 255, 0.08);
            padding: 6px 10px;
            border-radius: 8px;
            margin-bottom: 12px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .btn-add-cart {
            width: 100%;
            background: #2563eb;
            color: white;
            border: none;
            padding: 10px;
            border-radius: 10px;
            font-weight: 700;
            cursor: pointer;
            transition: background 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .btn-add-cart.added {
            background: #16a34a;
        }

        /* --- الشريط السفلي للسلة --- */
        .cart-bar {
            position: fixed;
            bottom: 0; left: 0; right: 0;
            background: rgba(15, 23, 42, 0.95);
            backdrop-filter: blur(16px);
            border-top: 2px solid #d97706;
            padding: 12px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            z-index: 1500;
            transform: translateY(100%);
            transition: transform 0.3s ease;
            box-shadow: 0 -5px 25px rgba(0,0,0,0.5);
        }

        .cart-bar.active { transform: translateY(0); }

        .cart-info { font-weight: 700; }
        .cart-count { color: #fbbf24; font-size: 14px; }
        .cart-total { color: #22c55e; font-size: 18px; font-weight: 800; }

        .btn-checkout {
            background: #16a34a;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 10px;
            font-weight: 800;
            cursor: pointer;
            font-size: 15px;
        }

        /* --- Modal --- */
        .modal {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(15, 23, 42, 0.75);
            backdrop-filter: blur(10px);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 2000;
            padding: 20px;
        }

        .modal-content {
            background: rgba(15, 23, 42, 0.95);
            backdrop-filter: blur(16px);
            border-radius: 16px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            width: 100%;
            max-width: 450px;
            max-height: 90vh;
            overflow-y: auto;
            padding: 20px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.5);
        }

        .modal-header {
            font-weight: 800;
            font-size: 18px;
            color: #fbbf24;
            margin-bottom: 15px;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            padding-bottom: 10px;
        }

        .selected-item-row {
            background: rgba(30, 41, 59, 0.7);
            padding: 10px;
            border-radius: 8px;
            margin-bottom: 10px;
            border: 1px solid rgba(255,255,255,0.1);
        }

        .form-group { margin-bottom: 12px; }

        .form-group label {
            display: block;
            font-size: 13px;
            font-weight: 700;
            margin-bottom: 5px;
            color: #cbd5e1;
        }

        .form-group input, .form-group textarea {
            width: 100%;
            padding: 10px;
            border: 1.5px solid rgba(255,255,255,0.2);
            border-radius: 8px;
            background: rgba(15, 23, 42, 0.9);
            color: #fff;
            font-size: 14px;
        }

        .form-group textarea {
            resize: vertical;
            min-height: 60px;
        }

        .btn-confirm {
            width: 100%;
            background: #16a34a;
            color: white;
            border: none;
            padding: 12px;
            border-radius: 10px;
            font-weight: 800;
            cursor: pointer;
            margin-top: 10px;
            font-size: 15px;
        }

        .btn-close {
            width: 100%;
            background: transparent;
            color: #94a3b8;
            border: none;
            padding: 8px;
            margin-top: 5px;
            cursor: pointer;
            font-size: 13px;
        }
    </style>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, getDocs } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBgKitAdhuq2B2iGGuMKSsXd4loF",
            authDomain: "mohammed-store-59677.firebaseapp.com",
            projectId: "mohammed-store-59677",
            storageBucket: "mohammed-store-59677.firebasestorage.app",
            messagingSenderId: "276394997556",
            appId: "1:276394997556:web:f7e495d9d02131f"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        let allProducts = [];
        let cart = [];

        async function loadProducts() {
            const grid = document.getElementById('productsGrid');
            try {
                const querySnapshot = await getDocs(collection(db, "products"));
                allProducts = [];
                querySnapshot.forEach(doc => allProducts.push({ id: doc.id, ...doc.data() }));
                
                updateAreaTabs();
                renderProducts(allProducts);
            } catch (e) {
                grid.innerHTML = '<p style="text-align:center; width:100%;">خطأ في تحميل المنتجات</p>';
            }
        }

        function updateAreaTabs() {
            const tabsContainer = document.getElementById('tabsContainer');
            const defaultAreas = ["عطبرة", "أمدرمان", "بورتسودان"];
            const existingAreas = new Set(defaultAreas);

            allProducts.forEach(p => { if (p.area) existingAreas.add(p.area); });

            let html = `<button class="tab-btn active" onclick="filterArea('all', this)">كل المناطق</button>`;
            existingAreas.forEach(area => {
                html += `<button class="tab-btn" onclick="filterArea('${area}', this)">${area}</button>`;
            });

            tabsContainer.innerHTML = html;
        }

        window.filterArea = function(area, btn) {
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');

            if (area === 'all') {
                renderProducts(allProducts);
            } else {
                const filtered = allProducts.filter(p => p.area === area);
                renderProducts(filtered);
            }
        };

        function renderProducts(products) {
            const grid = document.getElementById('productsGrid');
            grid.innerHTML = "";

            if (products.length === 0) {
                grid.innerHTML = '<p style="text-align:center; grid-column: 1/-1; color: #cbd5e1; padding: 40px; background: rgba(15, 23, 42, 0.6); border-radius: 12px;">لا توجد عروض متوفرة حالياً</p>';
                return;
            }

            products.forEach(p => {
                const isInCart = cart.some(item => item.id === p.id);
                const sizesDisplay = p.sizes ? p.sizes : 'جميع المقاسات متوفرة';

                grid.innerHTML += `
                    <div class="product-card ${isInCart ? 'selected' : ''}" id="card-${p.id}">
                        <div class="img-wrapper" onclick="openPreview('${p.img}')">
                            <img src="${p.img}" class="product-img" alt="${p.name}">
                        </div>
                        <div class="product-details">
                            <h3 class="product-title">${p.name}</h3>
                            <div class="product-price">${p.price} ج.س</div>
                            <div class="product-sizes-info">
                                📐 <strong>المقاسات المتاحة:</strong> ${sizesDisplay}
                            </div>
                            <button class="btn-add-cart ${isInCart ? 'added' : ''}" id="btn-${p.id}" onclick="toggleCart('${p.id}')">
                                ${isInCart ? '✓ تم الاختيار' : '🛒 إضافة للطلب'}
                            </button>
                        </div>
                    </div>
                `;
            });
        }

        window.toggleCart = function(productId) {
            const product = allProducts.find(p => p.id === productId);
            const index = cart.findIndex(item => item.id === productId);

            if (index > -1) {
                cart.splice(index, 1);
            } else {
                cart.push({ ...product, userSize: '' });
            }

            updateCartUI();
        };

        function updateCartUI() {
            allProducts.forEach(p => {
                const card = document.getElementById(`card-${p.id}`);
                const btn = document.getElementById(`btn-${p.id}`);
                const isInCart = cart.some(item => item.id === p.id);

                if (card && btn) {
                    if (isInCart) {
                        card.classList.add('selected');
                        btn.classList.add('added');
                        btn.innerHTML = '✓ تم الاختيار';
                    } else {
                        card.classList.remove('selected');
                        btn.classList.remove('added');
                        btn.innerHTML = '🛒 إضافة للطلب';
                    }
                }
            });

            const cartBar = document.getElementById('cartBar');
            const cartCount = document.getElementById('cartCount');
            const cartTotal = document.getElementById('cartTotal');

            if (cart.length > 0) {
                const totalAmount = cart.reduce((sum, item) => sum + Number(item.price || 0), 0);
                cartCount.innerText = `عدد العروض المختارة: ${cart.length}`;
                cartTotal.innerText = `${totalAmount} ج.س`;
                cartBar.classList.add('active');
            } else {
                cartBar.classList.remove('active');
            }
        }

        window.openCheckoutModal = function() {
            const container = document.getElementById('selectedProductsList');
            container.innerHTML = '';

            cart.forEach((item, idx) => {
                container.innerHTML += `
                    <div class="selected-item-row">
                        <div style="display:flex; justify-content:space-between; font-weight:bold; color:#fbbf24;">
                            <span>${idx + 1}. ${item.name}</span>
                            <span>${item.price} ج.س</span>
                        </div>
                        <div style="margin-top: 5px;">
                            <input type="text" placeholder="حدد المقاس لهذا العرض (مثال: M أو 42)" 
                                   onchange="updateItemSize('${item.id}', this.value)" 
                                   style="width:100%; padding:6px; border-radius:6px; border:1px solid #475569; background:#0f172a; color:#fff; font-size:12px;">
                        </div>
                    </div>
                `;
            });

            document.getElementById('checkoutModal').style.display = 'flex';
        };

        window.updateItemSize = function(id, value) {
            const item = cart.find(i => i.id === id);
            if (item) item.userSize = value.trim() || 'حسب المتاح';
        };

        window.closeCheckoutModal = function() {
            document.getElementById('checkoutModal').style.display = 'none';
        };

        window.submitOrderToWhatsApp = function() {
            const customerName = document.getElementById('custName').value.trim();
            const customerPhone = document.getElementById('custPhone').value.trim();
            const customerPhone2 = document.getElementById('custPhone2').value.trim();
            const customerAddress = document.getElementById('custAddress').value.trim();
            const customerNotes = document.getElementById('custNotes').value.trim();

            if (!customerName || !customerPhone || !customerAddress) {
                alert('يرجى إدخال الاسم، رقم الهاتف الرئيسي، والعنوان الدقيق.');
                return;
            }

            const myWhatsAppNumber = "249901358927";
            const totalAmount = cart.reduce((sum, item) => sum + Number(item.price || 0), 0);

            let itemsText = "";
            cart.forEach((item, index) => {
                const sizeStr = item.userSize ? item.userSize : 'غير محدد';
                itemsText += `${index + 1}. ${item.name}%0A   - المقاس: ${sizeStr}%0A   - السعر: ${item.price} ج.س%0A`;
            });

            let text = `طلب جديد - Mohamed Store%0A` +
                       `========================%0A` +
                       `المنتجات المطلوبة:%0A${itemsText}` +
                       `------------------------%0A` +
                       `عدد العروض: ${cart.length}%0A` +
                       `المبلغ الإجمالي: ${totalAmount} ج.س%0A` +
                       `========================%0A` +
                       `اسم الزبون: ${customerName}%0A` +
                       `رقم الهاتف الرئيسي: ${customerPhone}%0A`;

            if (customerPhone2) {
                text += `رقم هاتف احتياطي: ${customerPhone2}%0A`;
            }

            text += `العنوان والمنطقة: ${customerAddress}%0A`;

            if (customerNotes) {
                text += `ملاحظات الزبون: ${customerNotes}%0A`;
            }

            window.open(`https://wa.me/${myWhatsAppNumber}?text=${text}`, '_blank');
            closeCheckoutModal();
        };

        window.openPreview = function(imgSrc) {
            document.getElementById('previewModalImg').src = imgSrc;
            document.getElementById('previewModal').style.display = 'flex';
        };

        window.closePreview = function() {
            document.getElementById('previewModal').style.display = 'none';
        };

        window.onload = () => {
            loadProducts();
            setTimeout(() => {
                const splash = document.getElementById('splashScreen');
                if (splash) splash.classList.add('hidden');
            }, 1800);
        };
    </script>
</head>
<body>

    <div id="splashScreen">
        <img src="IMG-20260925-WA0048.jpg" alt="Mohamed Store Logo" class="splash-logo" onerror="this.parentElement.style.display='none';">
    </div>

    <div class="navbar">
        <div class="brand-container">
            <img src="IMG-20260925-WA0048.jpg" alt="Mohamed Store Logo" class="brand-logo-img" onerror="this.style.display='none';">
            <span class="brand-title">Mohamed Store</span>
        </div>
    </div>

    <div class="tabs-container" id="tabsContainer">
        <button class="tab-btn active" onclick="filterArea('all', this)">كل المناطق</button>
        <button class="tab-btn" onclick="filterArea('عطبرة', this)">عطبرة</button>
        <button class="tab-btn" onclick="filterArea('أمدرمان', this)">أمدرمان</button>
        <button class="tab-btn" onclick="filterArea('بورتسودان', this)">بورتسودان</button>
    </div>

    <div class="container">
        <div class="products-grid" id="productsGrid">
            <p style="text-align: center; width: 100%; grid-column: 1/-1; color: #fff;">جاري تحميل العروض...</p>
        </div>
    </div>

    <!-- شريط السلة السفلي -->
    <div class="cart-bar" id="cartBar">
        <div class="cart-info">
            <div class="cart-count" id="cartCount">عدد العروض: 0</div>
            <div class="cart-total" id="cartTotal">0 ج.س</div>
        </div>
        <button class="btn-checkout" onclick="openCheckoutModal()">إتمام الطلب الآن 🛍️</button>
    </div>

    <!-- نافذة إتمام الشراء -->
    <div class="modal" id="checkoutModal">
        <div class="modal-content">
            <div class="modal-header">تأكيد المشتريات والبيانات</div>
            
            <div style="margin-bottom: 15px;">
                <label style="font-weight: bold; color: #cbd5e1; font-size: 13px; display: block; margin-bottom: 8px;">العروض المختارة والمقاسات:</label>
                <div id="selectedProductsList"></div>
            </div>

            <div class="form-group">
                <label>اسمك الكامل *</label>
                <input type="text" id="custName" placeholder="مثال: محمد أحمد">
            </div>
            <div class="form-group">
                <label>رقم الهاتف الرئيسي *</label>
                <input type="tel" id="custPhone" placeholder="مثال: 0912345678">
            </div>
            <div class="form-group">
                <label>رقم هاتف احتياطي (اختياري)</label>
                <input type="tel" id="custPhone2" placeholder="مثال: 0123456789">
            </div>
            <div class="form-group">
                <label>المنطقة والعنوان الدقيق *</label>
                <input type="text" id="custAddress" placeholder="مثال: عطبرة - حي المطار">
            </div>
            <div class="form-group">
                <label>ملاحظات إضافية (اختياري)</label>
                <textarea id="custNotes" placeholder="مثال: التوصيل بعد الساعة 4 مساءً أو أي ملاحظة أخرى"></textarea>
            </div>
            <button class="btn-confirm" onclick="submitOrderToWhatsApp()">إرسال الطلب عبر الواتساب</button>
            <button class="btn-close" onclick="closeCheckoutModal()">إلغاء</button>
        </div>
    </div>

    <div class="modal" id="previewModal" onclick="closePreview()">
        <div class="modal-content" style="background: transparent; border: none; text-align: center;">
            <img id="previewModalImg" src="" style="max-width: 100%; max-height: 80vh; border-radius: 12px; border: 2px solid #fbbf24; box-shadow: 0 0 20px rgba(251, 191, 36, 0.5);">
        </div>
    </div>

</body>
</html>
