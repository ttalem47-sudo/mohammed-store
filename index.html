    <!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mohammed Store</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@500;700;800;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --glass-bg: rgba(255, 255, 255, 0.78);
            --glass-border: rgba(255, 255, 255, 0.85);
            --glass-shadow: 0 20px 50px rgba(0, 0, 0, 0.7);
            --text-dark: #050505;
            --text-muted: #2d3748;
            --accent-blue: #1d4ed8;
            --radius-main: 24px;
            --radius-card: 16px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Tajawal', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: #000000;
            background-image: radial-gradient(circle at 50% 0%, #1a1a1a 0%, #000000 75%);
            color: var(--text-dark);
            min-height: 100vh;
            padding: 20px 12px;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow-x: hidden;
        }

        .glass-window {
            width: 100%;
            max-width: 480px;
            background: var(--glass-bg);
            backdrop-filter: blur(25px) saturate(200%);
            -webkit-backdrop-filter: blur(25px) saturate(200%);
            border: 1px solid var(--glass-border);
            border-radius: var(--radius-main);
            box-shadow: var(--glass-shadow);
            padding: 24px 20px;
            position: relative;
        }

        .header-box {
            display: flex;
            align-items: center;
            gap: 16px;
            margin-bottom: 22px;
            padding-bottom: 16px;
            border-bottom: 1px solid rgba(0, 0, 0, 0.12);
            text-align: right;
        }

        .logo-img {
            width: 75px;
            height: 75px;
            border-radius: 50%;
            object-fit: cover;
            border: 2.5px solid #ffffff;
            box-shadow: 0 8px 20px rgba(0,0,0,0.3);
            flex-shrink: 0;
        }

        .header-titles {
            display: flex;
            flex-direction: column;
        }

        .welcome-title {
            font-size: 21px;
            font-weight: 900;
            color: var(--text-dark);
            letter-spacing: -0.3px;
        }

        .welcome-sub {
            font-size: 13px;
            font-weight: 700;
            color: var(--text-muted);
            margin-top: 3px;
            line-height: 1.4;
        }

        .form-group {
            text-align: right;
            margin-bottom: 16px;
        }

        .form-group label {
            display: block;
            font-weight: 800;
            font-size: 14px;
            margin-bottom: 6px;
            color: var(--text-dark);
        }

        select, input {
            width: 100%;
            padding: 13px 15px;
            border: 1.5px solid rgba(0, 0, 0, 0.15);
            border-radius: var(--radius-card);
            font-size: 15px;
            font-weight: 700;
            color: var(--text-dark);
            outline: none;
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(10px);
            transition: all 0.2s ease-in-out;
        }

        select:focus, input:focus {
            border-color: var(--accent-blue);
            background: #ffffff;
            box-shadow: 0 0 0 3px rgba(29, 78, 216, 0.25);
        }

        .products-section {
            margin-top: 20px;
            text-align: right;
        }

        .section-header {
            font-size: 16px;
            font-weight: 900;
            margin-bottom: 12px;
            color: var(--text-dark);
            border-bottom: 2px solid rgba(0,0,0,0.1);
            padding-bottom: 6px;
        }

        .product-card {
            border: 1px solid rgba(255, 255, 255, 0.9);
            border-radius: var(--radius-card);
            overflow: hidden;
            margin-bottom: 16px;
            background: rgba(255, 255, 255, 0.9);
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.08);
        }

        .product-img {
            width: 100%;
            height: 200px;
            object-fit: cover;
            background-color: #000;
        }

        .product-info {
            padding: 14px;
        }

        .product-title {
            font-size: 16px;
            font-weight: 800;
            color: var(--text-dark);
            margin-bottom: 4px;
        }

        .product-price {
            font-size: 17px;
            font-weight: 900;
            color: var(--accent-blue);
            margin-bottom: 10px;
        }

        .sizes-title {
            font-size: 12px;
            font-weight: 800;
            color: var(--text-muted);
            margin-bottom: 6px;
        }

        .sizes-options {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
        }

        .size-btn {
            padding: 7px 14px;
            border: 1.5px solid rgba(0, 0, 0, 0.2);
            border-radius: 8px;
            background: #ffffff;
            color: var(--text-dark);
            cursor: pointer;
            font-weight: 800;
            font-size: 13px;
        }

        .size-btn.active {
            background-color: var(--text-dark);
            color: #ffffff;
            border-color: var(--text-dark);
        }

        .btn-submit {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, #1d4ed8 0%, #0f172a 100%);
            color: #ffffff;
            border: none;
            border-radius: var(--radius-card);
            font-size: 16px;
            font-weight: 800;
            cursor: pointer;
            margin-top: 15px;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.3);
        }

        .success-card {
            display: none;
            padding: 20px 10px;
            text-align: center;
        }

        .success-title {
            font-size: 20px;
            font-weight: 900;
            color: #14532d;
            margin-bottom: 8px;
        }

        .success-desc {
            font-size: 14px;
            font-weight: 700;
            color: var(--text-dark);
            line-height: 1.6;
        }

        .hidden { display: none; }
    </style>

    <!-- Firebase SDK Modules -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, getDocs } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBgKitAdhuq2B2iGGuMKSsXd4loF",
            authDomain: "mohammed-store-59677.firebaseapp.com",
            projectId: "mohammed-store-59677",
            storageBucket: "mohammed-store-59677.firebasestorage.app",
            messagingSenderId: "276394997556",
            appId: "1:276394997556:web:f7e495d9d02131f"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        let allProducts = [];
        let selectedSize = "M";

        window.filterProducts = async function() {
            const area = document.getElementById('userLocation').value;
            const listContainer = document.getElementById('productList');
            listContainer.innerHTML = "جاري تحميل العروض المتاحة...";

            document.getElementById('productsSection').classList.remove('hidden');

            try {
                if(allProducts.length === 0) {
                    const querySnapshot = await getDocs(collection(db, "products"));
                    querySnapshot.forEach((docSnap) => {
                        allProducts.push({ id: docSnap.id, ...docSnap.data() });
                    });
                }

                listContainer.innerHTML = "";
                const filtered = allProducts.filter(p => p.area === area || area === "khartoum");

                if(filtered.length === 0) {
                    listContainer.innerHTML = "<p style='text-align:center; padding: 10px;'>لا توجد عروض متاحة في هذه المنطقة حالياً</p>";
                    return;
                }

                filtered.forEach(p => {
                    let sizesHTML = (p.sizes || ["M"]).map((s, index) => `<button class="size-btn ${index === 0 ? 'active' : ''}" onclick="selectSize(this, '${s}')">${s}</button>`).join('');
                    
                    listContainer.innerHTML += `
                        <div class="product-card">
                            <img src="${p.img}" alt="${p.name}" class="product-img">
                            <div class="product-info">
                                <h3 class="product-title">${p.name}</h3>
                                <div class="product-price">${p.price}</div>
                                <div class="sizes-title">حدد المقاس المناسب:</div>
                                <div class="sizes-options">${sizesHTML}</div>
                            </div>
                        </div>
                    `;
                });
            } catch (e) {
                listContainer.innerHTML = "حدث خطأ أثناء تحميل البيانات: " + e.message;
            }
        };

        window.selectSize = function(btn, size) {
            let siblings = btn.parentElement.querySelectorAll('.size-btn');
            siblings.forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            selectedSize = size;
        };

        window.submitOrder = function() {
            const name = document.getElementById('custName').value;
            const phone = document.getElementById('custPhone').value;
            const address = document.getElementById('custAddress').value;

            if(!name || !phone || !address) {
                alert('يرجى ملء جميع بيانات التوصيل للإتمام');
                return;
            }

            document.getElementById('orderFormFlow').style.display = 'none';
            document.getElementById('successCard').style.display = 'block';
        };
    </script>
</head>
<body>

<div class="glass-window">

    <div id="orderFormFlow">
        <div class="header-box">
            <img src="IMG-20260925-WA0048.jpg" alt="MOHAMMED STORE" class="logo-img">
            <div class="header-titles">
                <h1 class="welcome-title">Mohammed Store</h1>
                <p class="welcome-sub">Select your area to view the best available offers</p>
            </div>
        </div>

        <div class="form-group">
            <label for="userLocation">المنطقة أو المدينة</label>
            <select id="userLocation" onchange="filterProducts()">
                <option value="" disabled selected>-- حدد المنطقة --</option>
                <option value="khartoum">الخرطوم</option>
                <option value="omdurman">أم درمان</option>
                <option value="bahri">بحري</option>
            </select>
        </div>

        <div id="productsSection" class="products-section hidden">
            <h2 class="section-header">العروض المتاحة في منطقتك</h2>

            <div id="productList">
                <!-- المنتجات تظهر تلقائياً من قاعدة البيانات -->
            </div>

            <h2 class="section-header" style="margin-top: 25px;">بيانات التوصيل</h2>
            
            <div class="form-group">
                <label>الاسم الكامل</label>
                <input type="text" id="custName" placeholder="أدخل اسمك الثلاثي">
            </div>

            <div class="form-group">
                <label>رقم الهاتف</label>
                <input type="tel" id="custPhone" placeholder="0912345678">
            </div>

            <div class="form-group">
                <label>العنوان بالتفصيل</label>
                <input type="text" id="custAddress" placeholder="الحي، الشارع، ألمع معلم قريب">
            </div>

            <button class="btn-submit" onclick="submitOrder()">تأكيد الطلب الآن</button>
        </div>
    </div>

    <div id="successCard" class="success-card">
        <h2 class="success-title">تمت الطلبية بنجاح</h2>
        <p class="success-desc">
            نشكرك على التسوق من <strong>Mohammed Store</strong>.<br>
            ستصلك الشحنة في أسرع وقت بأمر الله.<br>
            سيتواصل معك مندوب التوصيل لتأكيد الموعد.
        </p>
    </div>

</div>

</body>
</html>
