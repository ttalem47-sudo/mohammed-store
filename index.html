<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mohammed Store - المتجر الإلكتروني</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Tajawal', sans-serif; }
        body { background: #0f172a; color: #f8fafc; padding-bottom: 90px; min-height: 100vh; }
        
        header {
            background: rgba(30, 41, 59, 0.9); border-bottom: 1px solid rgba(255,255,255,0.1);
            padding: 15px 20px; position: sticky; top: 0; z-index: 100; backdrop-filter: blur(10px);
            display: flex; justify-content: space-between; align-items: center;
        }
        .logo { font-size: 20px; font-weight: 800; color: #fbbf24; }
        
        .branch-selector-bar {
            background: #1e293b; padding: 12px 20px; display: flex; justify-content: center; gap: 10px;
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }
        .branch-btn {
            background: #0f172a; color: #cbd5e1; border: 1px solid rgba(255,255,255,0.15);
            padding: 8px 16px; border-radius: 8px; font-weight: 700; cursor: pointer; font-size: 13px;
        }
        .branch-btn.active { background: #d97706; color: white; border-color: #d97706; }

        .container { max-width: 1000px; margin: 20px auto; padding: 0 15px; }
        
        .section-title { font-size: 17px; font-weight: 800; color: #38bdf8; margin-bottom: 15px; }

        .products-grid {
            display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 15px;
        }
        .product-card {
            background: rgba(30, 41, 59, 0.85); border: 1px solid rgba(255,255,255,0.1);
            border-radius: 14px; overflow: hidden; display: flex; flex-direction: column;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }
        .product-img { width: 100%; height: 200px; object-fit: cover; background: #1e293b; }
        .product-body { padding: 12px; display: flex; flex-direction: column; flex-grow: 1; }
        .product-name { font-size: 15px; font-weight: 700; margin-bottom: 5px; color: #fff; }
        .product-price { font-size: 16px; font-weight: 800; color: #4ade80; margin-bottom: 8px; }
        .product-note { font-size: 12px; color: #fbbf24; margin-bottom: 8px; }
        
        .selector-row { margin-bottom: 8px; }
        .selector-row label { display: block; font-size: 11px; color: #cbd5e1; margin-bottom: 3px; font-weight: 700; }
        .selector-row select {
            width: 100%; padding: 6px; background: #0f172a; color: #fff; border: 1px solid rgba(255,255,255,0.2);
            border-radius: 6px; font-size: 12px;
        }

        .btn {
            background: #d97706; color: white; border: none; padding: 10px; border-radius: 8px;
            font-weight: 800; cursor: pointer; width: 100%; font-size: 13px; margin-top: auto;
            transition: background 0.2s;
        }
        .btn:hover { background: #b45309; }

        /* سلة التسوق العائمة أسفل الشاشة */
        .cart-bar {
            position: fixed; bottom: 0; left: 0; width: 100%; background: #1e293b;
            border-top: 1px solid rgba(255,255,255,0.15); padding: 12px 20px;
            display: flex; justify-content: space-between; align-items: center; z-index: 99;
            box-shadow: 0 -5px 20px rgba(0,0,0,0.4);
        }
        .cart-info { font-size: 14px; font-weight: 700; color: #fff; }
        .cart-btn { background: #2563eb; color: white; border: none; padding: 10px 20px; border-radius: 8px; font-weight: 800; cursor: pointer; }

        /* نافذة إتمام الطلب (Modal) */
        #checkoutModal {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(15, 23, 42, 0.9); display: none; justify-content: center; align-items: center;
            z-index: 1000; padding: 15px;
        }
        .modal-content {
            background: #1e293b; border: 1px solid rgba(255,255,255,0.2); border-radius: 16px;
            padding: 20px; width: 100%; max-width: 500px; max-height: 90vh; overflow-y: auto;
        }
        .form-group { margin-bottom: 10px; }
        .form-group label { display: block; font-size: 12px; font-weight: 700; margin-bottom: 4px; color: #cbd5e1; }
        .form-group input, .form-group textarea, .form-group select {
            width: 100%; padding: 9px; border: 1px solid rgba(255,255,255,0.2);
            border-radius: 8px; background: #0f172a; color: #fff; font-size: 13px;
        }
    </style>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, getDocs, addDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBgKitAdhuq2B2iGGuMKSsXd4loF",
            authDomain: "mohammed-store-59677.firebaseapp.com",
            projectId: "mohammed-store-59677",
            storageBucket: "mohammed-store-59677.firebasestorage.app",
            messagingSenderId: "276394997556",
            appId: "1:276394997556:web:f7e495d9d02131f"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        let products = [];
        let deliveryOptions = [];
        let cart = [];
        let currentBranch = 'عطبرة';

        window.switchStoreBranch = function(branchName) {
            currentBranch = branchName;
            document.querySelectorAll('.branch-btn').forEach(btn => {
                btn.classList.remove('active');
                if (btn.innerText.includes(branchName)) btn.classList.add('active');
            });
            cart = []; // تفريغ السلة عند تغيير الفرع لمنع تداخل الطلبات
            updateCartUI();
            loadStoreData();
        };

        async function loadStoreData() {
            try {
                // جلب المنتجات
                const productsSnap = await getDocs(collection(db, "products"));
                products = [];
                productsSnap.forEach(docSnap => {
                    products.push({ id: docSnap.id, ...docSnap.data() });
                });

                // جلب خيارات التوصيل
                const delSnap = await getDocs(collection(db, "delivery_options"));
                deliveryOptions = [];
                delSnap.forEach(docSnap => {
                    deliveryOptions.push({ id: docSnap.id, ...docSnap.data() });
                });

                renderProducts();
                renderDeliveryDropdowns();
            } catch (e) {
                console.error("Error loading store data", e);
            }
        }

        function renderProducts() {
            const container = document.getElementById('productsContainer');
            // فلترة المنتجات حسب الفرع المحدد فقط
            const filteredProducts = products.filter(p => (p.area || 'عطبرة') === currentBranch);

            if (filteredProducts.length === 0) {
                container.innerHTML = `<p style="grid-column: 1/-1; text-align:center; color:#94a3b8; padding:30px;">لا توجد عروض مضافة حالياً في فرع ${currentBranch}</p>`;
                return;
            }

            container.innerHTML = '';
            filteredProducts.forEach(p => {
                // تقسيم المقاسات والألوان إلى خيارات (Dropdowns)
                let sizesArr = p.sizes ? p.sizes.split(',').map(s => s.trim()) : ['قياسي'];
                let colorsArr = p.colors ? p.colors.split(',').map(c => c.trim()) : ['افتراضي'];

                let sizesOptions = sizesArr.map(s => `<option value="${s}">${s}</option>`).join('');
                let colorsOptions = colorsArr.map(c => `<option value="${c}">${c}</option>`).join('');

                container.innerHTML += `
                    <div class="product-card">
                        <img src="${p.img || 'https://via.placeholder.com/300'}" class="product-img" alt="صورة المنتج">
                        <div class="product-body">
                            <div class="product-name">${p.name}</div>
                            <div class="product-price">${p.price} ج.س</div>
                            ${p.adminNote ? `<div class="product-note">⚠️ ${p.adminNote}</div>` : ''}
                            
                            <div class="selector-row">
                                <label>المقاس:</label>
                                <select id="size-${p.id}">${sizesOptions}</select>
                            </div>
                            <div class="selector-row">
                                <label>اللون:</label>
                                <select id="color-${p.id}">${colorsOptions}</select>
                            </div>

                            <button class="btn" onclick="addToCart('${p.id}')">إضافة للسلة 🛒</button>
                        </div>
                    </div>
                `;
            });
        }

        function renderDeliveryDropdowns() {
            const select = document.getElementById('deliverySelect');
            const filteredDel = deliveryOptions.filter(d => (d.area || 'عطبرة') === currentBranch);

            select.innerHTML = '<option value="0">اختر منطقة التوصيل...</option>';
            filteredDel.forEach(d => {
                select.innerHTML += `<option value="${d.price}" data-name="${d.name}">${d.name} (${d.price} ج.س)</option>`;
            });
        }

        window.addToCart = function(productId) {
            const p = products.find(item => item.id === productId);
            if (!p) return;

            const selectedSize = document.getElementById(`size-${productId}`).value;
            const selectedColor = document.getElementById(`color-${productId}`).value;

            cart.push({
                ...p,
                size: selectedSize,
                color: selectedColor
            });

            updateCartUI();
            alert(`تمت إضافة "${p.name}" إلى سلة التسوق بنجاح!`);
        };

        function updateCartUI() {
            const count = cart.length;
            const total = cart.reduce((sum, item) => sum + Number(item.price), 0);
            
            document.getElementById('cartCountText').innerText = `المنتجات في السلة: ${count} قطع`;
            document.getElementById('cartTotalText').innerText = `المجموع: ${total} ج.س`;
        }

        window.openCheckoutModal = function() {
            if (cart.length === 0) {
                alert('سلة التسوق فارغة! اختر بعض المنتجات أولاً.');
                return;
            }
            renderDeliveryDropdowns();
            document.getElementById('checkoutModal').style.display = 'flex';
        }

        window.closeCheckoutModal = function() {
            document.getElementById('checkoutModal').style.display = 'none';
        }

        window.submitOrder = async function() {
            const name = document.getElementById('custName').value.trim();
            const phone = document.getElementById('custPhone').value.trim();
            const phone2 = document.getElementById('custPhone2').value.trim() || 'لا يوجد';
            const address = document.getElementById('custAddress').value.trim();
            const notes = document.getElementById('custNotes').value.trim() || 'لا توجد ملاحظات';
            
            const deliverySelect = document.getElementById('deliverySelect');
            const deliveryPrice = Number(deliverySelect.value);
            const deliveryName = deliverySelect.options[deliverySelect.selectedIndex].getAttribute('data-name') || 'توصيل عادي';

            if (!name || !phone || !address || deliverySelect.value === "0") {
                alert('يرجى ملء جميع الحقول المطلوبة (الاسم، الهاتف، العنوان، ومنطقة التوصيل)');
                return;
            }

            const productsTotal = cart.reduce((sum, item) => sum + Number(item.price), 0);
            const totalAmount = productsTotal + deliveryPrice;

            const orderData = {
                branch: currentBranch,
                customerName: name,
                customerPhone: phone,
                customerPhone2: phone2,
                customerAddress: address,
                deliveryService: `${deliveryName} (${deliveryPrice} ج.س)`,
                items: cart.map(i => ({ name: i.name, price: i.price, size: i.size, color: i.color, img: i.img })),
                totalAmount: totalAmount,
                date: new Date().toLocaleString('ar-EG')
            };

            try {
                // حفظ الطلب في قاعدة بيانات Firebase ليظهر فوراً في لوحة التحكم
                await addDoc(collection(db, "orders"), orderData);

                // تجهيز رسالة الواتساب للمشرف
                let itemsText = cart.map(i => `• ${i.name} (مقاس: ${i.size} | لون: ${i.color}) - ${i.price} ج.س`).join('\n');
                let waMessage = `*طلب جديد عبر المتجر (فرع ${currentBranch})* 📦\n\n` +
                                `👤 الاسم: ${name}\n` +
                                `📞 الهاتف: ${phone} ${phone2 !== 'لا يوجد' ? ' / ' + phone2 : ''}\n` +
                                `📍 العنوان: ${address}\n` +
                                `🚚 التوصيل: ${deliveryName} (${deliveryPrice} ج.س)\n\n` +
                                `🛍️ *المنتجات المطلوبة:*\n${itemsText}\n\n` +
                                `💰 *الإجمالي الكلي:* ${totalAmount} ج.س\n` +
                                `📝 ملاحظات: ${notes}`;

                // رقم واتساب المشرف (يمكنك تغليفه برقمك الشخصي بالصيغة الدولية)
                const adminWhatsAppPhone = "249900000000"; // استبدله برقمك
                const waUrl = `https://wa.me/${adminWhatsAppPhone}?text=${encodeURIComponent(waMessage)}`;

                alert('تم إرسال طلبك بنجاح وسجله في النظام! سيتم تحويلك الآن لتأكيد الطلب عبر واتساب.');
                cart = [];
                updateCartUI();
                closeCheckoutModal();
                window.open(waUrl, '_blank');
            } catch (e) {
                console.error("Error submitting order", e);
                alert('حدث خطأ أثناء إرسال الطلب، يرجى المحاولة مرة أخرى.');
            }
        };

        window.onload = () => {
            loadStoreData();
        };
    </script>
</head>
<body>

    <header>
        <div class="logo">Mohammed Store 🛒</div>
        <div style="font-size: 13px; color: #38bdf8; font-weight: bold;" id="headerBranchIndicator">متجر السودان</div>
    </header>

    <!-- شريط تبديل الفروع -->
    <div class="branch-selector-bar">
        <button class="branch-btn active" onclick="switchStoreBranch('عطبرة')">فرع عطبرة</button>
        <button class="branch-btn" onclick="switchStoreBranch('أمدرمان')">فرع أمدرمان</button>
        <button class="branch-btn" onclick="switchStoreBranch('بورتسودان')">فرع بورتسودان</button>
    </div>

    <div class="container">
        <div class="section-title">العروض والمنتجات المتاحة</div>
        <div id="productsContainer" class="products-grid">
            <p style="grid-column: 1/-1; text-align:center; color:#94a3b8; padding:30px;">جاري تحميل المنتجات...</p>
        </div>
    </div>

    <!-- شريط سلة التسوق السفلي -->
    <div class="cart-bar">
        <div>
            <div id="cartCountText" class="cart-info">المنتجات في السلة: 0 قطع</div>
            <div id="cartTotalText" style="font-size: 12px; color: #4ade80; font-weight: bold;">المجموع: 0 ج.س</div>
        </div>
        <button class="cart-btn" onclick="openCheckoutModal()">إتمام الطلب 🛍️</button>
    </div>

    <!-- نافذة إتمام الطلب -->
    <div id="checkoutModal">
        <div class="modal-content">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 8px;">
                <div style="font-size: 16px; font-weight: bold; color: #fbbf24;">إكمال تفاصيل الطلب</div>
                <button onclick="closeCheckoutModal()" style="background: none; border: none; color: #fff; font-size: 18px; cursor: pointer;">✕</button>
            </div>
            
            <form onsubmit="event.preventDefault(); submitOrder();">
                <div class="form-group">
                    <label>الاسم الكامل</label>
                    <input type="text" id="custName" placeholder="أدخل اسمك الكريم">
                </div>
                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 8px;">
                    <div class="form-group">
                        <label>رقم الهاتف الأساسي</label>
                        <input type="tel" id="custPhone" placeholder="مثال: 0912345678">
                    </div>
                    <div class="form-group">
                        <label>رقم هاتف إضافي (اختياري)</label>
                        <input type="tel" id="custPhone2" placeholder="رقم بديل">
                    </div>
                </div>
                <div class="form-group">
                    <label>عنوان الاستلام بالتفصيل</label>
                    <input type="text" id="custAddress" placeholder="الحي، المربع، معالم قريبة">
                </div>
                <div class="form-group">
                    <label>منطقة وسيلة التوصيل</label>
                    <select id="deliverySelect">
                        <option value="0">اختر منطقة التوصيل...</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>ملاحظات إضافية (اختياري)</label>
                    <textarea id="custNotes" rows="2" placeholder="أي تعليمات خاصة بالطلب..."></textarea>
                </div>
                <button type="submit" class="btn" style="background: #16a34a; margin-top: 10px;">تأكيد وإرسال الطلب عبر واتساب 📲</button>
            </form>
        </div>
    </div>

</body>
</html>
