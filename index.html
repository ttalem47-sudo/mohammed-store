<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mohammed Store - المتجر</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Tajawal', sans-serif; }
        body { background: #0f172a; color: #f8fafc; padding: 15px; min-height: 100vh; }
        
        .container { max-width: 600px; margin: 0 auto; }
        
        h1 { color: #fbbf24; text-align: center; margin-bottom: 20px; font-weight: 800; font-size: 22px; }
        
        .card {
            background: rgba(30, 41, 59, 0.85);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 16px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.3);
        }
        
        .card-title { font-size: 16px; font-weight: 800; color: #38bdf8; margin-bottom: 12px; }
        
        .form-group { margin-bottom: 12px; }
        .form-group label { display: block; font-size: 13px; font-weight: 700; margin-bottom: 5px; color: #cbd5e1; }
        .form-group select, .form-group input, .form-group textarea {
            width: 100%; padding: 10px; border: 1px solid rgba(255,255,255,0.2);
            border-radius: 8px; background: #0f172a; color: #fff; font-size: 14px;
        }

        .btn {
            background: #d97706; color: white; border: none; padding: 12px;
            border-radius: 8px; font-weight: 800; cursor: pointer; width: 100%; font-size: 15px;
            transition: background 0.2s;
        }
        .btn:hover { background: #b45309; }
        .btn-secondary { background: #3b82f6; margin-top: 10px; }
        .btn-secondary:hover { background: #1d4ed8; }

        /* الأقسام والفروع */
        .selection-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; margin-bottom: 15px; }
        .select-btn {
            background: #1e293b; color: #cbd5e1; border: 1px solid rgba(255,255,255,0.15);
            padding: 10px; border-radius: 8px; font-weight: 700; text-align: center; cursor: pointer; font-size: 13px;
        }
        .select-btn.active { background: #d97706; color: #fff; border-color: #d97706; }

        /* عرض المنتجات */
        .products-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 15px; }
        .product-card {
            background: #1e293b; border: 1px solid rgba(255,255,255,0.1); border-radius: 12px;
            padding: 10px; display: flex; flex-direction: column; justify-content: space-between;
        }
        .product-img { width: 100%; height: 120px; object-fit: cover; border-radius: 8px; margin-bottom: 8px; background: #0f172a; }
        .product-name { font-size: 14px; font-weight: bold; margin-bottom: 4px; color: #fff; }
        .product-price { font-size: 13px; color: #4ade80; font-weight: bold; margin-bottom: 8px; }
        
        .hidden { display: none !important; }
        
        .cart-item {
            background: #1e293b; padding: 10px; border-radius: 8px; margin-bottom: 8px;
            display: flex; justify-content: space-between; align-items: center; font-size: 13px;
        }
    </style>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, getDocs, addDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBgKitAdhuq2B2iGGuMKSsXd4loF",
            authDomain: "mohammed-store-59677.firebaseapp.com",
            projectId: "mohammed-store-59677",
            storageBucket: "mohammed-store-59677.firebasestorage.app",
            messagingSenderId: "276394997556",
            appId: "1:276394997556:web:f7e495d9d02131f"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        let allProducts = [];
        let deliveryOptions = [];
        let cart = [];
        let selectedBranch = 'عطبرة';
        let selectedCategory = 'الشبابي';

        window.setBranch = function(branch) {
            selectedBranch = branch;
            document.querySelectorAll('#branchGrid .select-btn').forEach(b => b.classList.remove('active'));
            event.target.classList.add('active');
            updateDeliveryDropdown();
        };

        window.setCategory = function(cat) {
            selectedCategory = cat;
            document.querySelectorAll('#catGrid .select-btn').forEach(b => b.classList.remove('active'));
            event.target.classList.add('active');
            renderStoreProducts();
        };

        async function loadStoreData() {
            try {
                // جلب المنتجات
                const prodSnap = await getDocs(collection(db, "products"));
                allProducts = [];
                prodSnap.forEach(docSnap => {
                    allProducts.push({ id: docSnap.id, ...docSnap.data() });
                });

                // جلب خيارات التوصيل
                const delSnap = await getDocs(collection(db, "delivery_options"));
                deliveryOptions = [];
                delSnap.forEach(docSnap => {
                    deliveryOptions.push({ id: docSnap.id, ...docSnap.data() });
                });

                updateDeliveryDropdown();
                renderStoreProducts();
            } catch (e) {
                console.error("Error loading store data", e);
            }
        }

        function updateDeliveryDropdown() {
            const select = document.getElementById('customerDelivery');
            select.innerHTML = '';
            const filtered = deliveryOptions.filter(d => (d.area || 'عطبرة') === selectedBranch);
            
            if(filtered.length === 0) {
                select.innerHTML = `<option value="توصيل عادي - 0">التوصيل العادي (مجاني أو حسب الاتفاق)</option>`;
                return;
            }

            filtered.forEach(d => {
                select.innerHTML += `<option value="${d.name} - ${d.price}">${d.name} (${d.price} ج.س)</option>`;
            });
        }

        function renderStoreProducts() {
            const container = document.getElementById('storeProductsContainer');
            // فلترة حسب الفرع والقسم
            const filtered = allProducts.filter(p => (p.area || 'عطبرة') === selectedBranch && (p.category || 'الشبابي') === selectedCategory);

            if(filtered.length === 0) {
                container.innerHTML = `<p style="text-align:center; color:#94a3b8; grid-column: span 2; padding:20px;">لا توجد عروض مضافة في قسم ${selectedCategory} حالياً</p>`;
                return;
            }

            container.innerHTML = '';
            filtered.forEach(p => {
                container.innerHTML += `
                    <div class="product-card">
                        <div>
                            <img src="${p.img}" class="product-img" onerror="this.src='https://via.placeholder.com/150'">
                            <div class="product-name">${p.name}</div>
                            <div class="product-price">${p.price} ج.س</div>
                            <div style="font-size:11px; color:#94a3b8; margin-bottom:6px;">المقاسات: ${p.sizes || 'متاح'} | الألوان: ${p.colors || 'متاح'}</div>
                        </div>
                        <button class="btn" style="padding:6px; font-size:12px;" onclick="addToCart('${p.id}')">إضافة للسلة</button>
                    </div>
                `;
            });
        }

        window.addToCart = function(id) {
            const product = allProducts.find(p => p.id === id);
            if(!product) return;

            let size = prompt(`أدخل المقاس المطلوب لـ (${product.name}):`, product.sizes ? product.sizes.split(',')[0] : 'سير/مقاس موحد');
            if(size === null) return;
            let color = prompt(`أدخل اللون المطلوب لـ (${product.name}):`, product.colors ? product.colors.split(',')[0] : 'افتراضي');
            if(color === null) return;

            cart.push({ ...product, size, color });
            updateCartUI();
            alert('تمت إضافة العرض إلى السلة بنجاح!');
        };

        function updateCartUI() {
            const list = document.getElementById('cartItemsList');
            const count = document.getElementById('cartCount');
            count.innerText = cart.length;

            if(cart.length === 0) {
                list.innerHTML = `<p style="text-align:center; color:#94a3b8; font-size:12px;">السلة فارغة</p>`;
                document.getElementById('totalAmountText').innerText = '0';
                return;
            }

            list.innerHTML = '';
            let total = 0;
            cart.forEach((item, index) => {
                total += Number(item.price);
                list.innerHTML += `
                    <div class="cart-item">
                        <div>
                            <strong>${item.name}</strong><br>
                            <span style="color:#94a3b8; font-size:11px;">المقاس: ${item.size} | اللون: ${item.color} | السعر: ${item.price} ج.س</span>
                        </div>
                        <button onclick="removeFromCart(${index})" style="background:#dc2626; color:#fff; border:none; padding:4px 8px; border-radius:4px; cursor:pointer; font-size:11px;">حذف</button>
                    </div>
                `;
            });
            document.getElementById('totalAmountText').innerText = total;
        }

        window.removeFromCart = function(index) {
            cart.splice(index, 1);
            updateCartUI();
        };

        window.submitOrder = async function() {
            if(cart.length === 0) {
                alert('سلة الشراء فارغة!');
                return;
            }

            const name = document.getElementById('cName').value.trim();
            const phone = document.getElementById('cPhone').value.trim();
            const phone2 = document.getElementById('cPhone2').value.trim() || 'لا يوجد';
            const address = document.getElementById('cAddress').value.trim();
            const deliveryService = document.getElementById('customerDelivery').value;
            const notes = document.getElementById('cNotes').value.trim() || 'لا توجد ملاحظات';

            if(!name || !phone || !address) {
                alert('يرجى ملء الحقول الإجبارية (الاسم، الهاتف، العنوان)');
                return;
            }

            let productsTotal = cart.reduce((sum, item) => sum + Number(item.price), 0);
            
            try {
                await addDoc(collection(db, "orders"), {
                    branch: selectedBranch,
                    customerName: name,
                    customerPhone: phone,
                    customerPhone2: phone2,
                    customerAddress: address,
                    deliveryService: deliveryService,
                    customerNotes: notes,
                    items: cart,
                    totalAmount: productsTotal,
                    date: new Date().toLocaleString('ar-EG')
                });

                alert('تم إرسال طلبك بنجاح! شكراً لتسوقك معنا.');
                cart = [];
                updateCartUI();
                document.getElementById('orderForm').reset();
            } catch(e) {
                console.error(e);
                alert('حدث خطأ أثناء إرسال الطلب');
            }
        };

        window.onload = () => {
            loadStoreData();
        };
    </script>
</head>
<body>

    <div class="container">
        <h1>Mohammed Store</h1>

        <!-- 1. اختيار الفرع -->
        <div class="card">
            <div class="card-title">اختر الفرع / المدينة</div>
            <div class="selection-grid" id="branchGrid">
                <div class="select-btn active" onclick="setBranch('عطبرة')">عطبرة</div>
                <div class="select-btn" onclick="setBranch('أمدرمان')">أمدرمان</div>
                <div class="select-btn" onclick="setBranch('بورتسودان')">بورتسودان</div>
            </div>
        </div>

        <!-- 2. اختيار القسم -->
        <div class="card">
            <div class="card-title">اختر القسم</div>
            <div class="selection-grid" id="catGrid">
                <div class="select-btn active" onclick="setCategory('الشبابي')">الشبابي</div>
                <div class="select-btn" onclick="setCategory('أطفالي')">أطفالي</div>
                <div class="select-btn" onclick="setCategory('اسبورتات')">اسبورتات</div>
            </div>
            
            <!-- عرض المنتجات حسب القسم والفرع -->
            <div class="products-grid" id="storeProductsContainer">
                <p style="text-align:center; color:#94a3b8; grid-column: span 2; padding:20px;">جاري تحميل العروض...</p>
            </div>
        </div>

        <!-- 3. سلة المشتريات وإتمام الطلب -->
        <div class="card">
            <div class="card-title">سلة المشتريات (<span id="cartCount">0</span> قطع)</div>
            <div id="cartItemsList">
                <p style="text-align:center; color:#94a3b8; font-size:12px;">السلة فارغة</p>
            </div>
            <div style="font-weight:bold; color:#4ade80; margin-top:10px; font-size:14px;">إجمالي المنتجات: <span id="totalAmountText">0</span> ج.س</div>
            
            <hr style="border: 0; border-top: 1px solid rgba(255,255,255,0.1); margin: 15px 0;">

            <div class="card-title" style="font-size:14px;">بيانات إتمام الطلب</div>
            <form id="orderForm" onsubmit="event.preventDefault(); submitOrder();">
                <div class="form-group">
                    <label>الاسم الكامل</label>
                    <input type="text" id="cName" placeholder="اسمك الكريم">
                </div>
                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px;">
                    <div class="form-group">
                        <label>رقم الهاتف الأساسي</label>
                        <input type="text" id="cPhone" placeholder="09xxxxxxxx">
                    </div>
                    <div class="form-group">
                        <label>رقم هاتف إضافي (اختياري)</label>
                        <input type="text" id="cPhone2" placeholder="رقم بديل">
                    </div>
                </div>
                <div class="form-group">
                    <label>العنوان بالتفصيل</label>
                    <textarea id="cAddress" rows="2" placeholder="المدينة، الحي، أقرب معلم"></textarea>
                </div>
                <div class="form-group">
                    <label>طريقة وسعر التوصيل</label>
                    <select id="customerDelivery"></select>
                </div>
                <div class="form-group">
                    <label>ملاحظات إضافية (اختياري)</label>
                    <input type="text" id="cNotes" placeholder="أي تفاصيل تخص الطلب">
                </div>
                <button type="submit" class="btn">تأكيد وإرسال الطلب</button>
            </form>
        </div>
    </div>

</body>
</html>
